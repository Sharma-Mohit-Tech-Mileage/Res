trigger:
  branches:
    include:
      - 'Dev'
      - 'Demo'
      - 'main'
      - 'main-dev'
      - 'Sparklight'

pr:
  autoCancel: true
  branches:
    include:
      - 'Dev'
      - 'Demo'
      - 'main'
      - 'main-dev'
      - 'Sparklight'

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: keyAlias
    value: 'sparklight'
  - name: jarsignerKeystorePassword
    value: sparklight_123
  - name: jarsignerKeyPassword
    value: sparklight_123
  - name: androidVersionCode
    value: $[counter('androidBuildVersionStore438', 438)]
  - name: androidVersionName
    value: '26.1.0'
  - name: ANDROID_UPLOAD_CERT_SHA1
    value: '53:91:E0:AC:75:92:E7:BD:4F:2A:24:6C:D3:66:7E:37:2D:3C:45:2A'
  - name: NPM_CONFIG_LEGACY_PEER_DEPS
    value: 'true'
  # iOS signing & deployment variables
  - name: IOS_CERT_PASSWORD
    value: 'Sparklight@123'
  - name: IOS_TEAM_ID
    value: 'W486HD85BD'
  - name: IOS_P12_CERT
    value: 'Sparklight_Bussiness_p12.p12'
  - name: IOS_CODE_SIGN_IDENTITY
    value: 'Apple Distribution'
  - name: IOS_BUNDLE_ID
    value: 'com.sparklight.customer.app'
  - name: IOS_PROV_PROFILE_SECUREFILE
    value: 'Sparklight_Residential_Profile.mobileprovision'
  - name: IOS_ASC_API_KEY_ID
    value: 'WH2L3V82PA'
  - name: IOS_ASC_API_ISSUER_ID
    value: '69a6de96-8e47-47e3-e053-5b8c7c11a4d1'
  - name: IOS_ASC_API_KEY_SECUREFILE
    value: 'AuthKey_WH2L3V82PA.p8'
  - name: IOS_REQUIRED_XCODE_MAJOR
    value: '26'
  - name: iosBuildNumber
    value: $[counter('iosBuildNumberStore', 40)]
  # Email notification variables
  # Set NOTIFICATION_EMAILS as a comma-separated list of recipient addresses.
  # Set SMTP_SERVER, SMTP_USERNAME, and SMTP_PASSWORD as secret pipeline variables
  # in Azure DevOps (Pipeline > Edit > Variables) — do NOT store credentials in YAML.
  - name: NOTIFICATION_EMAILS
    value: 'Mohit.Sharma@cableone.biz'
  - name: DEMO_NOTIFICATION_EMAILS
    value: 'Mohit.Sharma@cableone.biz,mohit.sharma@sciata.com'
  - name: SMTP_SERVER
    value: ''  # e.g. smtp.office365.com or smtp.gmail.com
  - name: SMTP_PORT
    value: '587'

parameters:
  - name: runSecurityChecks
    displayName: 'Run Security Checks'
    type: boolean
    default: true
  - name: enforceFullCoverage
    displayName: 'Enforce 100% Coverage'
    type: boolean
    default: false
  - name: minCoveragePercent
    displayName: 'Minimum Coverage Percent (default when not full mode)'
    type: number
    default: 90
  - name: deployToInternalTesting
    displayName: 'Deploy to Internal Testing'
    type: boolean
    default: true
  - name: deployToTestFlight
    displayName: 'Deploy to TestFlight'
    type: boolean
    default: true

stages:
  # ==========================================
  # STAGE 0: INITIAL COMMIT CHECK
  # ==========================================
  - stage: InitialCommit
    displayName: '🧾 Initial Commit Check'
    jobs:
      - job: CommitValidation
        displayName: 'Validate Commit Context'
        steps:
          - checkout: self
            clean: true

          - script: |
              echo "=== Initial Commit Validation ==="
              echo "Reason: $(Build.Reason)"
              echo "Branch: $(Build.SourceBranchName)"
              echo "Source Branch Ref: $(Build.SourceBranch)"
              echo "PR Target Branch: $(System.PullRequest.TargetBranch)"
              echo "Commit: $(Build.SourceVersion)"
              echo "Requested by: $(Build.RequestedFor)"
              echo "Pipeline split will run Android and iOS paths in parallel."
            displayName: 'Validate Initial Commit Metadata'

          - script: |
              python3 - <<'PYEOF'
              import os, smtplib
              from email.mime.text import MIMEText
              from email.mime.multipart import MIMEMultipart

              smtp_server = os.environ.get('SMTP_SERVER', '').strip()
              smtp_port = int(os.environ.get('SMTP_PORT', '587') or '587')
              smtp_user = os.environ.get('SMTP_USERNAME', 'azuredevops@microsoft.com').strip()
              smtp_pass = os.environ.get('SMTP_PASSWORD', '').strip()
              branch = os.environ.get('BUILD_BRANCH', 'N/A')
              commit = os.environ.get('BUILD_COMMIT', 'N/A')
              reason = os.environ.get('BUILD_REASON', 'N/A')
              url = os.environ.get('BUILD_URL', '')
              recipients_raw = os.environ.get('DEMO_NOTIFICATION_EMAILS', '').strip() or os.environ.get('NOTIFICATION_EMAILS', '').strip()
              recipients = [r.strip() for r in recipients_raw.split(',') if r.strip()]

              if not smtp_server or not smtp_pass or not recipients:
                  print('Initial commit email skipped: SMTP credentials or notification recipients not configured.')
                  print(f'SMTP_SERVER={bool(smtp_server)}, SMTP_USERNAME={smtp_user}, SMTP_PASSWORD={bool(smtp_pass)}, recipients={recipients}')
                  exit(0)

              msg = MIMEMultipart('alternative')
              msg['From'] = smtp_user
              msg['To'] = ', '.join(recipients)
              msg['Subject'] = f'[MySparklight] Demo branch build started: {branch}'

              body_text = f"""MySparklight Residential - Demo build started.

              Branch: {branch}
              Commit: {commit}
              Reason: {reason}
              Pipeline: {url}
              """

              body_html = f"""<html><body>
              <h2>Demo build started</h2>
              <p>Branch: {branch}<br>
              Commit: {commit}<br>
              Reason: {reason}</p>
              <p>Pipeline: <a href=\"{url}\">{url}</a></p>
              </body></html>"""

              msg.attach(MIMEText(body_text, 'plain'))
              msg.attach(MIMEText(body_html, 'html'))

              with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as server:
                  server.ehlo()
                  server.starttls()
                  server.ehlo()
                  server.login(smtp_user, smtp_pass)
                  server.sendmail(smtp_user, recipients, msg.as_string())

              print('Initial commit notification sent to: ' + ', '.join(recipients))
              PYEOF
            displayName: 'Send initial commit email'
            condition: eq(variables['Build.SourceBranchName'], 'Demo')
            env:
              SMTP_SERVER: $(SMTP_SERVER)
              SMTP_PORT: $(SMTP_PORT)
              SMTP_USERNAME: $(SMTP_USERNAME)
              SMTP_PASSWORD: $(SMTP_PASSWORD)
              DEMO_NOTIFICATION_EMAILS: $(DEMO_NOTIFICATION_EMAILS)
              BUILD_BRANCH: $(Build.SourceBranchName)
              BUILD_COMMIT: $(Build.SourceVersion)
              BUILD_REASON: $(Build.Reason)
              BUILD_URL: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)

  # ==========================================
  # STAGE 1: BUILD
  # ==========================================

  - stage: DemoPromotion
    displayName: 'Demo Promotion Deploy'
    dependsOn:
      - InitialCommit
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'Demo'))
    jobs:
      - job: DeployPreviousDevArtifacts
        displayName: 'Deploy Previous Dev Artifacts'
        pool:
          vmImage: 'macos-latest'
        steps:
          - checkout: self
            clean: true

          - script: |
              python3 - <<'PYEOF'
              import os, smtplib
              from email.mime.text import MIMEText
              from email.mime.multipart import MIMEMultipart

              smtp_server = os.environ.get('SMTP_SERVER', '').strip()
              smtp_port = int(os.environ.get('SMTP_PORT', '587') or '587')
              smtp_user = os.environ.get('SMTP_USERNAME', '').strip()
              smtp_pass = os.environ.get('SMTP_PASSWORD', '').strip()
              recipients = [r.strip() for r in os.environ.get('DEMO_NOTIFICATION_EMAILS', '').split(',') if r.strip()]

              if not smtp_server or not smtp_user or not smtp_pass or not recipients:
                  print('Email notification skipped: SMTP credentials or notification recipients not configured.')
                  exit(0)

              msg = MIMEMultipart('alternative')
              msg['From'] = smtp_user
              msg['To'] = ', '.join(recipients)
              msg['Subject'] = '[MySparklight] Demo promotion initiated from Dev to Demo'

              body_text = f"""MySparklight Residential - Demo deployment initiated from Dev to Demo.

              Please be patient while the pipeline completes deployment to Play Store and TestFlight.

              Build Branch: {os.environ.get('BUILD_BRANCH', 'Demo')}
              Commit: {os.environ.get('BUILD_COMMIT', '')}
              """

              body_html = f"""<html><body>
              <h2>Demo promotion initiated from Dev to Demo</h2>
              <p>Please be patient while the pipeline completes deployment to Play Store and TestFlight.</p>
              <p><strong>Branch:</strong> {os.environ.get('BUILD_BRANCH', 'Demo')}<br>
              <strong>Commit:</strong> {os.environ.get('BUILD_COMMIT', '')}</p>
              </body></html>"""

              msg.attach(MIMEText(body_text, 'plain'))
              msg.attach(MIMEText(body_html, 'html'))

              with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as server:
                  server.ehlo()
                  server.starttls()
                  server.ehlo()
                  server.login(smtp_user, smtp_pass)
                  server.sendmail(smtp_user, recipients, msg.as_string())

              print('Demo promotion start email sent to: ' + ', '.join(recipients))
              PYEOF
            displayName: 'Send demo promotion start email'
            env:
              SMTP_SERVER: $(SMTP_SERVER)
              SMTP_PORT: $(SMTP_PORT)
              SMTP_USERNAME: $(SMTP_USERNAME)
              SMTP_PASSWORD: $(SMTP_PASSWORD)
              DEMO_NOTIFICATION_EMAILS: $(DEMO_NOTIFICATION_EMAILS)
              BUILD_BRANCH: $(Build.SourceBranchName)
              BUILD_COMMIT: $(Build.SourceVersion)

          - script: |
              set -euo pipefail
              ORG_URL='$(System.CollectionUri)'
              PROJECT='$(System.TeamProject)'
              DEFINITION_ID='$(System.DefinitionId)'
              DEV_BRANCH='refs/heads/Dev'
              TOKEN='$(System.AccessToken)'

              echo "Finding latest successful Dev build for definition $DEFINITION_ID..."
              BUILD_API="$ORG_URL$PROJECT/_apis/build/builds?definitions=$DEFINITION_ID&branchName=$DEV_BRANCH&statusFilter=completed&resultFilter=succeeded&\$top=1&api-version=7.1-preview.7"
              BUILD_JSON=$(curl -s -u :$TOKEN "$BUILD_API")
              DEV_BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.value[0].id // empty')

              if [ -z "$DEV_BUILD_ID" ]; then
                echo '❌ Could not find a successful Dev build to promote.'
                echo "Build API response: $BUILD_JSON"
                exit 1
              fi

              BUILD_DETAILS_API="$ORG_URL$PROJECT/_apis/build/builds/$DEV_BUILD_ID?api-version=7.1-preview.7"
              BUILD_DETAILS_JSON=$(curl -s -u :$TOKEN "$BUILD_DETAILS_API")
              DEV_ANDROID_VERSION_CODE=$(echo "$BUILD_DETAILS_JSON" | jq -r '.variables.androidVersionCode.value // empty')
              DEV_IOS_BUILD_NUMBER=$(echo "$BUILD_DETAILS_JSON" | jq -r '.variables.iosBuildNumber.value // empty')

              if [ -z "$DEV_ANDROID_VERSION_CODE" ]; then
                echo '❌ Could not read androidVersionCode from Dev build details.'
                echo "$BUILD_DETAILS_JSON"
                exit 1
              fi
              if [ -z "$DEV_IOS_BUILD_NUMBER" ]; then
                echo '❌ Could not read iosBuildNumber from Dev build details.'
                echo "$BUILD_DETAILS_JSON"
                exit 1
              fi

              ARTIFACTS_API="$ORG_URL$PROJECT/_apis/build/builds/$DEV_BUILD_ID/artifacts?api-version=7.1-preview.5"
              ARTIFACTS_JSON=$(curl -s -u :$TOKEN "$ARTIFACTS_API")
              DEV_ANDROID_ARTIFACT=$(echo "$ARTIFACTS_JSON" | jq -r '.value[] | select(.name | startswith("android-build-")) | .name' | head -n1)
              DEV_IOS_ARTIFACT=$(echo "$ARTIFACTS_JSON" | jq -r '.value[] | select(.name == "ios-ipa") | .name' | head -n1)

              if [ -z "$DEV_ANDROID_ARTIFACT" ]; then
                echo '❌ Could not locate Android artifact name in Dev build artifacts.'
                echo "$ARTIFACTS_JSON"
                exit 1
              fi
              if [ -z "$DEV_IOS_ARTIFACT" ]; then
                echo '❌ Could not locate iOS artifact name in Dev build artifacts.'
                echo "$ARTIFACTS_JSON"
                exit 1
              fi

              echo "##vso[task.setvariable variable=DEV_BUILD_ID]$DEV_BUILD_ID"
              echo "##vso[task.setvariable variable=DEV_ANDROID_ARTIFACT]$DEV_ANDROID_ARTIFACT"
              echo "##vso[task.setvariable variable=DEV_IOS_ARTIFACT]$DEV_IOS_ARTIFACT"
            displayName: 'Locate latest Dev build artifacts'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - task: DownloadBuildArtifacts@0
            displayName: 'Download Android artifact from Dev build'
            inputs:
              buildType: 'specific'
              project: '$(System.TeamProject)'
              definition: '$(System.DefinitionId)'
              buildId: '$(DEV_BUILD_ID)'
              downloadType: 'specific'
              artifactName: '$(DEV_ANDROID_ARTIFACT)'
              downloadPath: '$(Pipeline.Workspace)/android-demo-artifact'

          - task: DownloadBuildArtifacts@0
            displayName: 'Download iOS artifact from Dev build'
            inputs:
              buildType: 'specific'
              project: '$(System.TeamProject)'
              definition: '$(System.DefinitionId)'
              buildId: '$(DEV_BUILD_ID)'
              downloadType: 'specific'
              artifactName: '$(DEV_IOS_ARTIFACT)'
              downloadPath: '$(Pipeline.Workspace)/ios-demo-artifact'

          - script: |
              set -euo pipefail
              AAB_PATH=$(find "$(Pipeline.Workspace)/android-demo-artifact" -type f -name "*.aab" | head -n 1)
              IPA_PATH=$(find "$(Pipeline.Workspace)/ios-demo-artifact" -type f -name "*.ipa" | head -n 1)
              if [ -z "$AAB_PATH" ]; then
                echo '❌ Missing Android AAB artifact after download.'
                find "$(Pipeline.Workspace)/android-demo-artifact" -type f | sort
                exit 1
              fi
              if [ -z "$IPA_PATH" ]; then
                echo '❌ Missing iOS IPA artifact after download.'
                find "$(Pipeline.Workspace)/ios-demo-artifact" -type f | sort
                exit 1
              fi
              echo "##vso[task.setvariable variable=AAB_FILE_PATH]$AAB_PATH"
              echo "##vso[task.setvariable variable=IPA_FILE_PATH]$IPA_PATH"
              DEMO_VERSION_CODE=$((DEV_ANDROID_VERSION_CODE + 1))
              DEMO_IOS_BUILD_NUMBER=$((DEV_IOS_BUILD_NUMBER + 1))
              echo "##vso[task.setvariable variable=DEMO_VERSION_CODE]$DEMO_VERSION_CODE"
              echo "##vso[task.setvariable variable=DEMO_IOS_BUILD_NUMBER]$DEMO_IOS_BUILD_NUMBER"
              echo "AAB_PATH=$AAB_PATH"
              echo "IPA_PATH=$IPA_PATH"
              echo "DEMO_VERSION_CODE=$DEMO_VERSION_CODE"
              echo "DEMO_IOS_BUILD_NUMBER=$DEMO_IOS_BUILD_NUMBER"
            displayName: 'Resolve artifact paths and demo version code'
            env:
              DEV_ANDROID_VERSION_CODE: $(DEV_ANDROID_VERSION_CODE)
              DEV_IOS_BUILD_NUMBER: $(DEV_IOS_BUILD_NUMBER)

          - task: ms-vsclient.google-play.google-play-release.GooglePlayRelease@4
            displayName: 'Publish AAB to Play Store Internal Testing'
            condition: eq('${{ parameters.deployToInternalTesting }}', 'true')
            inputs:
              serviceConnection: 'PlaystoreRessiConnection'
              applicationId: 'com.sparklight'
              action: 'SingleBundle'
              bundleFile: '$(AAB_FILE_PATH)'
              track: 'internal'
              releaseName: 'MySparklight Residential $(androidVersionName)'
              changeLogFile: '$(Build.ArtifactStagingDirectory)/play-release-notes.txt'

          - task: DownloadSecureFile@1
            name: ascApiKey
            displayName: 'Download App Store Connect API key (.p8)'
            inputs:
              secureFile: '$(IOS_ASC_API_KEY_SECUREFILE)'

          - task: DownloadSecureFile@1
            name: iosP12
            displayName: 'Download Apple Certificate (.p12)'
            inputs:
              secureFile: '$(IOS_P12_CERT)'

          - script: |
              set -euo pipefail
              P12_PASSWORD="${IOS_CERT_PASSWORD:-${IOS_P12_PASSWORD:-}}"
              KEYCHAIN_PATH="$(Agent.TempDirectory)/ios-demo-signing.keychain-db"
              KEYCHAIN_PASSWORD="demo_keychain_$(date +%s)"

              security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
              security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
              security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

              IMPORT_OUTPUT_FILE="$(Agent.TempDirectory)/ios_demo_import.txt"
              set +e
              security import "$(iosP12.secureFilePath)" \
                -k "$KEYCHAIN_PATH" \
                -P "$P12_PASSWORD" \
                -T /usr/bin/codesign \
                -T /usr/bin/security > "$IMPORT_OUTPUT_FILE" 2>&1
              IMPORT_EXIT_CODE=$?
              set -e

              if [ $IMPORT_EXIT_CODE -ne 0 ]; then
                echo "❌ Failed to import p12 certificate"
                cat "$IMPORT_OUTPUT_FILE"
                exit 1
              fi

              EXISTING=$(security list-keychains -d user | tr -d '"' | xargs)
              security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING
              security default-keychain -d user -s "$KEYCHAIN_PATH"

              echo "##vso[task.setvariable variable=IOS_KEYCHAIN_PATH]$KEYCHAIN_PATH"
              echo "##vso[task.setvariable variable=IOS_KEYCHAIN_PASSWORD]$KEYCHAIN_PASSWORD"
            displayName: 'Install Apple certificate for Demo IPA re-sign'
            env:
              IOS_CERT_PASSWORD: $(IOS_CERT_PASSWORD)
              IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)

          - script: |
              set -euo pipefail
              IPA_PATH='$(IPA_FILE_PATH)'
              DEMO_IOS_BUILD_NUMBER='$(DEMO_IOS_BUILD_NUMBER)'
              if [ -z "$IPA_PATH" ]; then
                echo '❌ IPA_PATH not set'
                exit 1
              fi
              if [ -z "$DEMO_IOS_BUILD_NUMBER" ]; then
                echo '❌ DEMO_IOS_BUILD_NUMBER must be set'
                exit 1
              fi

              KEY_PATH="$(ascApiKey.secureFilePath)"
              KEY_FILE_NAME="AuthKey_$(IOS_ASC_API_KEY_ID).p8"
              mkdir -p "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys" "$(Agent.TempDirectory)/private_keys"
              cp "$KEY_PATH" "$HOME/private_keys/$KEY_FILE_NAME"
              cp "$KEY_PATH" "$HOME/.private_keys/$KEY_FILE_NAME"
              cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/$KEY_FILE_NAME"
              cp "$KEY_PATH" "$(Agent.TempDirectory)/private_keys/$KEY_FILE_NAME"

              TMP_DIR="$(Agent.TempDirectory)/demo_ios_patch"
              rm -rf "$TMP_DIR"
              mkdir -p "$TMP_DIR"
              unzip -q "$IPA_PATH" -d "$TMP_DIR"

              APP_PATH=$(find "$TMP_DIR/Payload" -maxdepth 2 -type d -name "*.app" | head -n 1)
              if [ -z "$APP_PATH" ]; then
                echo '❌ Could not locate .app inside IPA payload'
                find "$TMP_DIR/Payload" -maxdepth 2 -type d | sort
                exit 1
              fi

              INFO_PLIST="$APP_PATH/Info.plist"
              if [ ! -f "$INFO_PLIST" ]; then
                echo "❌ Info.plist not found at $INFO_PLIST"
                exit 1
              fi

              echo "Setting CFBundleVersion and CURRENT_PROJECT_VERSION to $DEMO_IOS_BUILD_NUMBER"
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $DEMO_IOS_BUILD_NUMBER" "$INFO_PLIST" 2>/dev/null || \
                /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $DEMO_IOS_BUILD_NUMBER" "$INFO_PLIST"
              /usr/libexec/PlistBuddy -c "Set :CURRENT_PROJECT_VERSION $DEMO_IOS_BUILD_NUMBER" "$INFO_PLIST" 2>/dev/null || \
                /usr/libexec/PlistBuddy -c "Add :CURRENT_PROJECT_VERSION string $DEMO_IOS_BUILD_NUMBER" "$INFO_PLIST"

              echo "Re-signing app with $IOS_CODE_SIGN_IDENTITY"
              codesign --force --sign "$IOS_CODE_SIGN_IDENTITY" --preserve-metadata=identifier,entitlements,requirements,resource-rules "$APP_PATH"

              UPDATED_IPA_PATH="$(Agent.TempDirectory)/demo_updated.ipa"
              cd "$TMP_DIR"
              zip -qr "$UPDATED_IPA_PATH" Payload

              echo "Uploading $UPDATED_IPA_PATH to TestFlight..."
              xcrun altool --upload-app --type ios --file "$UPDATED_IPA_PATH" --apiKey "$(IOS_ASC_API_KEY_ID)" --apiIssuer "$(IOS_ASC_API_ISSUER_ID)" --show-progress
              echo "✅ IPA submitted to App Store Connect / TestFlight"
            displayName: 'Upload IPA to TestFlight'
            condition: eq('${{ parameters.deployToTestFlight }}', 'true')

          - script: |
              python3 - <<'PYEOF'
              import os, smtplib
              from email.mime.text import MIMEText
              from email.mime.multipart import MIMEMultipart

              smtp_server = os.environ.get('SMTP_SERVER', '').strip()
              smtp_port = int(os.environ.get('SMTP_PORT', '587') or '587')
              smtp_user = os.environ.get('SMTP_USERNAME', '').strip()
              smtp_pass = os.environ.get('SMTP_PASSWORD', '').strip()
              recipients = [r.strip() for r in os.environ.get('DEMO_NOTIFICATION_EMAILS', '').split(',') if r.strip()]

              if not smtp_server or not smtp_user or not smtp_pass or not recipients:
                  print('Email notification skipped: SMTP credentials or notification recipients not configured.')
                  exit(0)

              msg = MIMEMultipart('alternative')
              msg['From'] = smtp_user
              msg['To'] = ', '.join(recipients)
              msg['Subject'] = '[MySparklight] Demo promotion deployment successful'

              body_text = f"""MySparklight Residential - Demo deployment completed successfully.

              Version Code: {os.environ.get('DEMO_VERSION_CODE', 'N/A')}
              Android Version: {os.environ.get('ANDROID_VERSION_NAME', 'N/A')}
              Build Number: {os.environ.get('DEMO_VERSION_CODE', 'N/A')}
              Branch: {os.environ.get('BUILD_BRANCH', 'Demo')}
              Commit: {os.environ.get('BUILD_COMMIT', '')}
              """

              body_html = f"""<html><body>
              <h2>Demo promotion deployment successful</h2>
              <p>Play Store and TestFlight deployment completed.</p>
              <table style='border-collapse:collapse;font-family:Arial,sans-serif;font-size:14px;'>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Branch</td><td style='padding:4px 12px;'>{os.environ.get('BUILD_BRANCH', 'Demo')}</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Commit</td><td style='padding:4px 12px;'>{os.environ.get('BUILD_COMMIT', '')}</td></tr>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Version Code</td><td style='padding:4px 12px;'>{os.environ.get('DEMO_VERSION_CODE', 'N/A')}</td></tr>
              </table>
              </body></html>"""

              msg.attach(MIMEText(body_text, 'plain'))
              msg.attach(MIMEText(body_html, 'html'))

              with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as server:
                  server.ehlo()
                  server.starttls()
                  server.ehlo()
                  server.login(smtp_user, smtp_pass)
                  server.sendmail(smtp_user, recipients, msg.as_string())

              print('Demo promotion completion email sent to: ' + ', '.join(recipients))
              PYEOF
            displayName: 'Send demo promotion completion email'
            env:
              SMTP_SERVER: $(SMTP_SERVER)
              SMTP_PORT: $(SMTP_PORT)
              SMTP_USERNAME: $(SMTP_USERNAME)
              SMTP_PASSWORD: $(SMTP_PASSWORD)
              DEMO_NOTIFICATION_EMAILS: $(DEMO_NOTIFICATION_EMAILS)
              BUILD_BRANCH: $(Build.SourceBranchName)
              BUILD_COMMIT: $(Build.SourceVersion)
              ANDROID_VERSION_NAME: $(androidVersionName)
              DEMO_VERSION_CODE: $(DEMO_VERSION_CODE)
            continueOnError: true

  - stage: UnitTests
    displayName: 'Unit Tests'
    dependsOn: InitialCommit
    condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'Demo'))
    jobs:
      - job: RunAndroidUnitTests
        displayName: 'Run Android Unit Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: 'Install JDK 17'
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: NodeTool@0
            displayName: 'Install Node 20.6.1'
            inputs:
              versionSpec: '20.6.1'

          - script: |
              npm install --legacy-peer-deps
              npm install --no-save --legacy-peer-deps jest-junit
              npx update-browserslist-db@latest --yes || true
            displayName: 'Install Dependencies'
            workingDirectory: '.'

          - script: |
              echo "Running Android unit tests..."
              cd android
              ./gradlew testDemoReleaseUnitTest --no-daemon
            displayName: 'Run Android Unit Tests'

          - task: PublishTestResults@2
            displayName: 'Publish Android Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/build/test-results/**/*.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)/android'
              mergeTestResults: true
              failTaskOnFailedTests: false

      - job: RunIOSUnitTests
        displayName: 'Run iOS Unit Tests'
        pool:
          vmImage: 'macos-latest'
        timeoutInMinutes: 90
        cancelTimeoutInMinutes: 10
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Install Node 20.6.1'
            inputs:
              versionSpec: '20.6.1'

          - script: |
              npm install --legacy-peer-deps
              npm install --no-save --legacy-peer-deps jest-junit
              npx update-browserslist-db@latest --yes || true
            displayName: 'Install Dependencies'
            workingDirectory: '.'

          - script: |
              echo "Running application-wide Jest test cases..."
              npx jest --ci --coverage --watchAll=false --passWithNoTests --reporters=default --reporters=jest-junit
            displayName: 'Run App-wide Jest Test Cases'
            workingDirectory: '.'

          - task: PublishTestResults@2
            displayName: 'Publish iOS Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              mergeTestResults: true
              failTaskOnFailedTests: false

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Coverage Reports'
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/coverage'
              ArtifactName: 'coverage-reports'
              publishLocation: 'Container'

      - job: EnforceCoverageGate
        displayName: 'Enforce Coverage Gate'
        dependsOn:
          - RunIOSUnitTests
        condition: succeeded('RunIOSUnitTests')
        pool:
          vmImage: 'macos-latest'
        steps:
          - checkout: self

          - script: |
              node -e "const fs=require('fs'); const p='coverage/coverage-summary.json'; if(!fs.existsSync(p)){console.error('coverage-summary.json not found'); process.exit(1);} const data=JSON.parse(fs.readFileSync(p,'utf8')); const t=data.total||{}; const keys=['lines','statements','functions','branches']; const fullRaw=String('${{ parameters.enforceFullCoverage }}'); const full=fullRaw.toLowerCase()==='true'; const minRaw=String('${{ parameters.minCoveragePercent }}'); const min=Number(minRaw); const target=full?100:(Number.isFinite(min)?min:0); const coverageByKey=Object.fromEntries(keys.map((k)=>[k,{total:Number((t[k]||{}).total||0),pct:Number((t[k]||{}).pct||0)}])); const hasInstrumentedCoverage=keys.some((k)=>coverageByKey[k].total>0); const hasNonZeroCoverage=keys.some((k)=>coverageByKey[k].pct>0); if(!hasInstrumentedCoverage||!hasNonZeroCoverage){console.warn('No usable JS coverage data found (totals or percentages are all zero). Skipping coverage gate.'); process.exit(0);} let failed=false; console.log('Coverage mode: '+(full?'strict':'threshold')); console.log('Coverage target: '+target+'%'); for(const k of keys){const pct=coverageByKey[k].pct; console.log(k+': '+pct+'%'); if(pct<target){failed=true;}} if(failed){console.error('Coverage gate failed: required '+target+'% for lines/statements/functions/branches.'); process.exit(1);} console.log('Coverage gate passed.');"
            displayName: 'Evaluate Coverage Summary'
            workingDirectory: '.'

  # ==========================================
  # STAGE 3: SECURITY & CODE QUALITY
  # ==========================================

  - stage: SecurityAndQuality
    displayName: 'Security & Code Quality'
    dependsOn: UnitTests
    condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'Demo'))
    jobs:
      # -------- Job 1: Lint Quality Checks --------
      - job: LintQualityChecks
        displayName: 'Lint Quality Checks'
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Install Node'
            inputs:
              versionSpec: '20.6.1'

          - script: |
              npm install --legacy-peer-deps
            displayName: 'Install Dependencies'

          - script: |
              echo "Running ESLint analysis..."
              npx eslint src/ --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json 2>&1 || true
              if [ -f eslint-report.json ]; then
                ESLINT_COUNT=$(jq 'length' eslint-report.json 2>/dev/null || echo '0')
                ESLINT_ISSUE_COUNT=$(jq '[.[].messages[]] | length' eslint-report.json 2>/dev/null || echo '0')
                echo "✓ ESLint: Analyzed $ESLINT_COUNT files, found $ESLINT_ISSUE_COUNT issues"
              else
                echo "⚠️ ESLint: No report generated"
              fi
            displayName: 'Run ESLint'
            continueOnError: true

          - script: |
              echo "Running Prettier check..."
              PRETTIER_OUTPUT=$(npx prettier --check src/ 2>&1 || true)
              echo "$PRETTIER_OUTPUT" | tee prettier-report.txt
              if echo "$PRETTIER_OUTPUT" | grep -q 'file'; then
                PRETTIER_ISSUE_COUNT=$(echo "$PRETTIER_OUTPUT" | grep -c 'file' || echo '0')
                echo "✓ Prettier: Found $PRETTIER_ISSUE_COUNT formatting issues"
              else
                echo "✓ Prettier: All files formatted correctly"
              fi
            displayName: 'Run Prettier Check'
            continueOnError: true

          - script: |
              set -euo pipefail
              REPORT_DIR="$(Build.ArtifactStagingDirectory)/lint-reports"
              mkdir -p "$REPORT_DIR"
              SUMMARY_FILE="$REPORT_DIR/lint-summary.txt"
              
              {
                echo "=== JavaScript Lint Report Summary ==="
                echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo ""
              } > "$SUMMARY_FILE"
              
              if [ -f "$(System.DefaultWorkingDirectory)/eslint-report.json" ]; then
                cp "$(System.DefaultWorkingDirectory)/eslint-report.json" "$REPORT_DIR/"
                ESLINT_COUNT=$(jq 'length' "$REPORT_DIR/eslint-report.json" 2>/dev/null || echo '0')
                ESLINT_ISSUE_COUNT=$(jq '[.[].messages[]] | length' "$REPORT_DIR/eslint-report.json" 2>/dev/null || echo '0')
                {
                  echo "ESLint Results:"
                  echo "  Files Analyzed: $ESLINT_COUNT"
                  echo "  Total Issues: $ESLINT_ISSUE_COUNT"
                  echo ""
                } >> "$SUMMARY_FILE"
              else
                echo "  ESLint: No report generated (check npm dependencies or src/ path)" >> "$SUMMARY_FILE"
                echo "" >> "$SUMMARY_FILE"
              fi
              
              if [ -f "$(System.DefaultWorkingDirectory)/prettier-report.txt" ]; then
                cp "$(System.DefaultWorkingDirectory)/prettier-report.txt" "$REPORT_DIR/"
                PRETTIER_ISSUE_COUNT=$(grep -c 'file' "$REPORT_DIR/prettier-report.txt" 2>/dev/null || echo '0')
                {
                  echo "Prettier Results:"
                  echo "  Formatting Issues: $PRETTIER_ISSUE_COUNT"
                  echo ""
                } >> "$SUMMARY_FILE"
              else
                echo "  Prettier: No report generated" >> "$SUMMARY_FILE"
                echo "" >> "$SUMMARY_FILE"
              fi
              
              FILE_COUNT=$(find "$REPORT_DIR" -type f \( -name 'eslint-report.json' -o -name 'prettier-report.txt' \) | wc -l)
              if [ "$FILE_COUNT" -eq 0 ]; then
                {
                  echo "⚠️ Lint Report Status: No lint reports were generated."
                  echo "Possible Causes:"
                  echo "  - Dependencies may not have installed correctly"
                  echo "  - Source directory (src/) may be empty or inaccessible"
                  echo "  - ESLint/Prettier may have encountered a fatal error"
                  echo ""
                  echo "Action: Check build logs for npm install errors."
                } >> "$SUMMARY_FILE"
              else
                {
                  echo "✓ Lint Report Status: Reports generated successfully"
                } >> "$SUMMARY_FILE"
              fi
            displayName: 'Stage and Summarize Lint Reports'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Lint Reports'
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/lint-reports'
              ArtifactName: 'lint-reports'
              publishLocation: 'Container'

      # -------- Job 2: SAST Scanning --------
      - job: SecurityScanning
        displayName: 'Static Application Security Testing (SAST)'
        condition: ${{ parameters.runSecurityChecks }}
        steps:
          - checkout: self

          - script: |
              echo "Installing dependency-check..."
              set +e
              ZIP_FILE="dependency-check-release.zip"
              CANDIDATE_URLS=(
                "https://github.com/jeremylong/DependencyCheck/releases/latest/download/dependency-check-release.zip"
                "https://github.com/jeremylong/DependencyCheck_Home/releases/latest/download/dependency-check-release.zip"
              )

              DOWNLOADED="false"
              for URL in "${CANDIDATE_URLS[@]}"; do
                echo "Trying: $URL"
                if curl -fsSL "$URL" -o "$ZIP_FILE"; then
                  DOWNLOADED="true"
                  break
                fi
              done

              if [ "$DOWNLOADED" = "true" ]; then
                unzip -oq "$ZIP_FILE"
                if [ -x "$(pwd)/dependency-check/bin/dependency-check.sh" ]; then
                  "$(pwd)/dependency-check/bin/dependency-check.sh" --version || true
                else
                  echo "dependency-check extracted but executable not found; will skip scan."
                fi
              else
                echo "Dependency-Check download failed from all candidate URLs; scan step will be skipped."
              fi
            displayName: 'Setup Dependency-Check'
            continueOnError: true

          - script: |
              REPORT_DIR="$(System.DefaultWorkingDirectory)/dependency-check-report"
              mkdir -p "$REPORT_DIR"

              if [ ! -x "$(pwd)/dependency-check/bin/dependency-check.sh" ]; then
                echo "{\"status\":\"skipped\",\"reason\":\"dependency-check unavailable\"}" > "$(System.DefaultWorkingDirectory)/dependency-check-report.json"
                echo "Dependency-Check not available; vulnerability scan skipped."
                exit 0
              fi

              "$(pwd)/dependency-check/bin/dependency-check.sh" \
                --scan "$(System.DefaultWorkingDirectory)" \
                --format JSON \
                --project "Sparklight Residential App" \
                --out "$REPORT_DIR" || echo "Dependency check completed with warnings"

              if [ -f "$REPORT_DIR/dependency-check-report.json" ]; then
                cp "$REPORT_DIR/dependency-check-report.json" "$(System.DefaultWorkingDirectory)/dependency-check-report.json"
              fi
            displayName: 'Run Dependency Check (Vulnerability Scanning)'
            continueOnError: true

          - script: |
              echo "Analyzing package.json for known vulnerabilities..."
              npm audit --audit-level=moderate --json --package-lock-only > npm-audit-report.json || echo "npm audit completed with warnings"
            displayName: 'Run npm Audit'
            continueOnError: true

          - script: |
              if [ -f "npm-audit-report.json" ]; then
                echo "=== NPM Audit Report ==="
                cat npm-audit-report.json
              fi
              if [ -f "dependency-check-report.json" ]; then
                echo "=== Dependency Check Report ==="
                python3 -m json.tool dependency-check-report.json | head -50
              fi
            displayName: 'Display Security Reports'
            continueOnError: true

          - script: |
              REPORT_DIR="$(Build.ArtifactStagingDirectory)/security-reports"
              mkdir -p "$REPORT_DIR"

              if [ -f "$(System.DefaultWorkingDirectory)/npm-audit-report.json" ]; then
                cp "$(System.DefaultWorkingDirectory)/npm-audit-report.json" "$REPORT_DIR/"
              fi

              if [ -f "$(System.DefaultWorkingDirectory)/dependency-check-report.json" ]; then
                cp "$(System.DefaultWorkingDirectory)/dependency-check-report.json" "$REPORT_DIR/"
              fi

              if [ -z "$(find "$REPORT_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "No security report files were generated." > "$REPORT_DIR/security-summary.txt"
              fi
            displayName: 'Stage Security Reports'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Security Reports'
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/security-reports'
              ArtifactName: 'security-reports'
              publishLocation: 'Container'

      - job: RunIOSSecurityChecks
        displayName: 'Run iOS Security and Lint Checks'
        pool:
          vmImage: 'macos-latest'
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Install Node 20.6.1'
            inputs:
              versionSpec: '20.6.1'

          - script: npm install --legacy-peer-deps
            displayName: 'Install Dependencies'

          - script: |
              npx eslint src/ --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true
            displayName: 'Run ESLint (iOS Path)'
            continueOnError: true

          - script: |
              npx prettier --check src/ 2>&1 | tee prettier-report.txt || true
            displayName: 'Run Prettier Check (iOS Path)'
            continueOnError: true

          - script: |
              npm audit --audit-level=moderate --json --package-lock-only > npm-audit-report.json || true
            displayName: 'Run npm Audit (iOS Path)'
            continueOnError: true

          - script: |
              set -euo pipefail

              LINT_DIR="$(Build.ArtifactStagingDirectory)/ios-lint-stage"
              SEC_DIR="$(Build.ArtifactStagingDirectory)/ios-security-stage"
              mkdir -p "$LINT_DIR" "$SEC_DIR"

              if [ -f "$(System.DefaultWorkingDirectory)/eslint-report.json" ]; then
                cp "$(System.DefaultWorkingDirectory)/eslint-report.json" "$LINT_DIR/"
              fi

              if [ -f "$(System.DefaultWorkingDirectory)/prettier-report.txt" ]; then
                cp "$(System.DefaultWorkingDirectory)/prettier-report.txt" "$LINT_DIR/"
              fi

              if [ -f "$(System.DefaultWorkingDirectory)/npm-audit-report.json" ]; then
                cp "$(System.DefaultWorkingDirectory)/npm-audit-report.json" "$SEC_DIR/"
              fi

              if [ -z "$(find "$LINT_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "No lint files." > "$LINT_DIR/lint-summary.txt"
              fi

              if [ -z "$(find "$SEC_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "No security files." > "$SEC_DIR/security-summary.txt"
              fi
            displayName: 'Stage iOS Security and Lint Reports'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish iOS Lint Stage Reports'
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/ios-lint-stage'
              ArtifactName: 'ios-lint-stage-reports'
              publishLocation: 'Container'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish iOS Security Stage Reports'
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/ios-security-stage'
              ArtifactName: 'ios-security-stage-reports'
              publishLocation: 'Container'

      # -------- Job 3: Android Lint --------
      - job: AndroidLint
        displayName: 'Android Lint Checks'
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: 'Install JDK 17'
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: |
              set -euo pipefail
              cd android
              echo "Starting Android Lint for Demo Release variant..."
              if ./gradlew lintDemoRelease --no-daemon 2>&1 | tee lint-build.log; then
                echo "✓ Android Lint completed successfully"
              else
                echo "⚠️ Android Lint encountered issues (check detailed logs below)"
              fi
            displayName: 'Run Android Lint'
            continueOnError: true

          - script: |
              set -euo pipefail
              SOURCE_DIR="$(System.DefaultWorkingDirectory)/android/app/build/reports"
              REPORT_DIR="$(Build.ArtifactStagingDirectory)/android-lint-reports"
              mkdir -p "$REPORT_DIR"
              SUMMARY_FILE="$REPORT_DIR/android-lint-summary.txt"
              
              {
                echo "=== Android Lint Report Summary ==="
                echo "Variant: demoRelease"
                echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo ""
              } > "$SUMMARY_FILE"
              
              if [ -d "$SOURCE_DIR" ]; then
                echo "Source directory found: $SOURCE_DIR"
                cp -R "$SOURCE_DIR"/. "$REPORT_DIR/" 2>/dev/null || true
                
                LINT_REPORT_COUNT=$(find "$REPORT_DIR" -name 'lint-results*.xml' -o -name 'lint-results*.html' | wc -l || echo '0')
                {
                  echo "Reports Generated: $LINT_REPORT_COUNT"
                  echo ""
                  if [ "$LINT_REPORT_COUNT" -gt 0 ]; then
                    echo "Report Files:"
                    find "$REPORT_DIR" -type f -name 'lint-results*' -exec ls -lh {} \; | awk '{print "  " $9 " (" $5 ")"}'
                  fi
                  echo ""
                } >> "$SUMMARY_FILE"
              else
                echo "Source directory NOT found: $SOURCE_DIR" >> "$SUMMARY_FILE"
              fi
              
              if [ -f "$(System.DefaultWorkingDirectory)/android/lint-build.log" ]; then
                {
                  echo "Build Log (last 50 lines):"
                  tail -50 "$(System.DefaultWorkingDirectory)/android/lint-build.log" | sed 's/^/  /'
                  echo ""
                } >> "$SUMMARY_FILE"
              fi
              
              if [ -z "$(find "$REPORT_DIR" -name 'lint-results*' -type f 2>/dev/null)" ]; then
                {
                  echo "⚠️ Lint Report Status: No lint result files were generated."
                  echo ""
                  echo "Possible Causes:"
                  echo "  1. Gradle build may have failed before lint task"
                  echo "  2. No lint issues detected (build succeeded silently)"
                  echo "  3. Build configuration may not include lintOptions"
                  echo "  4. Insufficient permissions or disk space"
                  echo ""
                  echo "Action: Check gradle build log above for detailed errors."
                } >> "$SUMMARY_FILE"
              else
                {
                  echo "✓ Lint Report Status: Report files generated successfully"
                } >> "$SUMMARY_FILE"
              fi
            displayName: 'Stage and Summarize Android Lint Reports'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Android Lint Reports'
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/android-lint-reports'
              ArtifactName: 'android-lint-reports'
              publishLocation: 'Container'

  # ==========================================
  # STAGE 4: CODE REVIEW
  # ==========================================

  - stage: Build
    displayName: 'Android Build'
    dependsOn: SecurityAndQuality
    condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'Demo'))
    jobs:
      - job: BuildAndroid
        displayName: 'Build Android App Bundle'
        steps:
          - checkout: self
            clean: true

          - task: JavaToolInstaller@0
            displayName: 'Install JDK 17'
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: java -version
            displayName: 'Check Java Version'

          - task: NodeTool@0
            displayName: 'Install Node 20.6.1'
            inputs:
              versionSpec: '20.6.1'

          - script: npm cache clean --force
            displayName: 'Clean npm cache'

          - script: npm install --legacy-peer-deps
            displayName: 'Install node dependencies'

          - task: DownloadSecureFile@1
            name: keystoreFile
            displayName: 'Download Keystore File'
            inputs:
              secureFile: 'Sparklight.keystore'

          - script: |
              set -euo pipefail
              KEYSTORE_PATH="$(keystoreFile.secureFilePath)"
              EXPECTED_SHA1="$(ANDROID_UPLOAD_CERT_SHA1)"

              ACTUAL_SHA1=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$(keyAlias)" -storepass "$(jarsignerKeystorePassword)" -keypass "$(jarsignerKeyPassword)" | sed -n 's/^.*SHA1:[[:space:]]*\(.*\)$/\1/p' | head -n1 | tr -d '[:space:]')
              EXPECTED_NORMALIZED=$(echo "$EXPECTED_SHA1" | tr -d '[:space:]')

              echo "Resolved upload key SHA1: $ACTUAL_SHA1"
              echo "Expected upload key SHA1: $EXPECTED_NORMALIZED"

              if [ -z "$ACTUAL_SHA1" ]; then
                echo "❌ Could not read SHA1 fingerprint from keystore alias $(keyAlias)."
                exit 1
              fi

              if [ "$ACTUAL_SHA1" != "$EXPECTED_NORMALIZED" ]; then
                echo "❌ Keystore fingerprint mismatch."
                echo "The uploaded keystore does not match the Google Play upload key for package com.sparklight."
                exit 1
              fi

              echo "✅ Keystore fingerprint matches expected Play upload key."
            displayName: 'Validate Android upload keystore fingerprint'

          - task: Gradle@4
            displayName: 'Build Android App Bundle (Demo Release)'
            inputs:
              workingDirectory: 'android'
              gradleWrapperFile: 'android/gradlew'
              tasks: 'clean bundleDemoRelease'
              options: >
                -PKEYSTORE_PATH=$(keystoreFile.secureFilePath)
                -PKEYSTORE_PASSWORD=$(jarsignerKeystorePassword)
                -PKEY_ALIAS=$(keyAlias)
                -PKEY_PASSWORD=$(jarsignerKeyPassword)
                -PVERSION_CODE=$(androidVersionCode)
                -PVERSION_NAME=$(androidVersionName)
                --stacktrace
                --warning-mode all
              publishJUnitResults: false

          - script: |
              echo "Build completed successfully"
              echo "Version: $(androidVersionName)"
              echo "Build Code: $(androidVersionCode)"
            displayName: 'Build Summary'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish APK/AAB Artifacts'
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/android/app/build/outputs'
              ArtifactName: 'android-build-$(androidVersionName)'
              publishLocation: 'Container'

  # ==========================================
  # STAGE 1B: iOS Build (Parallel)
  # ==========================================

  - stage: IOSBuild
    displayName: 'iOS Build'
    dependsOn: SecurityAndQuality
    condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'Demo'))
    jobs:
      - job: RunIOSBuild
        displayName: 'Build iOS IPA (Xcode Archive)'
        pool:
          vmImage: 'macos-latest'
        timeoutInMinutes: 240
        cancelTimeoutInMinutes: 15
        steps:
          - checkout: self
            clean: true

          - script: |
              set -euo pipefail
              REQUIRED_XCODE_MAJOR="$(IOS_REQUIRED_XCODE_MAJOR)"
              MATCHED_XCODE="$(ls -d /Applications/Xcode_${REQUIRED_XCODE_MAJOR}*.app 2>/dev/null | sort -V | tail -n 1 || true)"

              echo "Installed Xcode apps:"
              ls -1 /Applications | grep '^Xcode' || true

              if [ -z "$MATCHED_XCODE" ]; then
                echo "❌ Xcode ${REQUIRED_XCODE_MAJOR}.x is not installed on this agent image."
                echo "This app must be built with iPhoneOS SDK ${REQUIRED_XCODE_MAJOR} or later."
                echo "Use an agent image that provides Xcode ${REQUIRED_XCODE_MAJOR}+ (or newer)."
                exit 1
              fi

              sudo xcode-select -s "$MATCHED_XCODE/Contents/Developer"
              echo "Xcode:"; xcodebuild -version
              echo "SDKs:"; xcodebuild -showsdks

              if ! xcodebuild -showsdks | grep -q "iphoneos${REQUIRED_XCODE_MAJOR}"; then
                echo "❌ Required iPhoneOS SDK ${REQUIRED_XCODE_MAJOR} is not available in selected Xcode."
                exit 1
              fi

              echo "Ruby:"; ruby -v
              echo "CocoaPods:"; pod --version || true
            displayName: 'Select Xcode and verify build tools'

          - task: NodeTool@0
            displayName: 'Install Node 20.6.1'
            inputs:
              versionSpec: '20.6.1'

          - script: npm install --legacy-peer-deps
            displayName: 'Install Node dependencies'

          - script: |
              set -euo pipefail
              cd ios
              rm -rf Pods Podfile.lock build
              pod install --repo-update
            displayName: 'Install CocoaPods dependencies'

          - script: |
              set -euo pipefail
              PBXPROJ="ios/My Sparklight.xcodeproj/project.pbxproj"
              perl -pi -e 's/CODE_SIGN_IDENTITY = "iOS Distribution"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' "$PBXPROJ"
              perl -pi -e 's/"iOS Distribution"/"Apple Distribution"/g' "$PBXPROJ"
              perl -pi -e 's/CODE_SIGN_IDENTITY\[sdk=iphoneos\*\] = "iOS Distribution"/CODE_SIGN_IDENTITY[sdk=iphoneos*] = "Apple Distribution"/g' "$PBXPROJ"
              echo "✅ Patched CODE_SIGN_IDENTITY"
            displayName: 'Patch code sign identity'

          - task: DownloadSecureFile@1
            name: iosP12
            displayName: 'Download Apple Certificate (.p12)'
            inputs:
              secureFile: '$(IOS_P12_CERT)'

          - script: |
              set -euo pipefail
              P12_PASSWORD="${IOS_CERT_PASSWORD:-${IOS_P12_PASSWORD:-}}"
              KEYCHAIN_PATH="$(Agent.TempDirectory)/ios-signing.keychain-db"
              KEYCHAIN_PASSWORD="temp_keychain_$(date +%s)"
              security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
              security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
              security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

              IMPORT_OUTPUT_FILE="$(Agent.TempDirectory)/import_output.txt"
              set +e
              security import "$(iosP12.secureFilePath)" \
                -k "$KEYCHAIN_PATH" \
                -P "$P12_PASSWORD" \
                -T /usr/bin/codesign \
                -T /usr/bin/security > "$IMPORT_OUTPUT_FILE" 2>&1
              IMPORT_EXIT_CODE=$?
              set -e

              if [ $IMPORT_EXIT_CODE -ne 0 ]; then
                echo "Initial certificate import failed:"
                cat "$IMPORT_OUTPUT_FILE"

                if [ -n "$P12_PASSWORD" ]; then
                  echo "Retrying certificate import with empty password..."
                  set +e
                  security import "$(iosP12.secureFilePath)" \
                    -k "$KEYCHAIN_PATH" \
                    -P "" \
                    -T /usr/bin/codesign \
                    -T /usr/bin/security > "$IMPORT_OUTPUT_FILE" 2>&1
                  IMPORT_EXIT_CODE=$?
                  set -e
                fi
              fi

              if [ $IMPORT_EXIT_CODE -ne 0 ]; then
                echo "Certificate import failed after retries:"
                cat "$IMPORT_OUTPUT_FILE"
                echo "Ensure IOS_CERT_PASSWORD or IOS_P12_PASSWORD matches the uploaded .p12 file."
                exit 1
              fi

              security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>&1 || true
              EXISTING=$(security list-keychains -d user | tr -d '"' | xargs)
              security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING
              security default-keychain -d user -s "$KEYCHAIN_PATH"
              echo "##vso[task.setvariable variable=IOS_KEYCHAIN_PATH]$KEYCHAIN_PATH"
              echo "##vso[task.setvariable variable=IOS_KEYCHAIN_PASSWORD]$KEYCHAIN_PASSWORD"
              echo "✅ Certificate imported"
            displayName: 'Install certificate into keychain'
            env:
              IOS_CERT_PASSWORD: $(IOS_CERT_PASSWORD)
              IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)

          - task: InstallAppleProvisioningProfile@1
            name: iosProvProfile
            displayName: 'Install provisioning profile'
            inputs:
              provisioningProfileLocation: 'secureFiles'
              provProfileSecureFile: '$(IOS_PROV_PROFILE_SECUREFILE)'
              removeProfile: true

          - script: |
              set -euo pipefail
              echo "Disabling code signing for all Pods xcconfig targets..."
              find "ios/Pods" -name "*.xcconfig" | while IFS= read -r f; do
                grep -q "CODE_SIGNING_ALLOWED" "$f" || echo "CODE_SIGNING_ALLOWED = NO" >> "$f"
              done
              echo "✅ Pods code signing disabled"
            displayName: 'Disable code signing for Pods'

          - script: |
              set -euo pipefail
              APP_INFO_PLIST="ios/Sparklight/Info.plist"
              BUILD_NUMBER="$(iosBuildNumber)"
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP_INFO_PLIST" \
                || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$APP_INFO_PLIST"
              echo "iOS build number: $BUILD_NUMBER"
            displayName: 'Set iOS build number'

          - script: |
              set -euo pipefail
              NODE_BIN="$(command -v node)"
              echo "export NODE_BINARY=$NODE_BIN" > ios/.xcode.env.local
              ARCHIVE_PATH="$(Build.ArtifactStagingDirectory)/My Sparklight.xcarchive"
              EXPORT_PATH="$(Build.ArtifactStagingDirectory)/ipa"
              LOG_DIR="$(Build.ArtifactStagingDirectory)/ios-build-logs"
              mkdir -p "$LOG_DIR"
              ARCHIVE_LOG="$LOG_DIR/xcodebuild-archive.log"
              EXPORT_LOG="$LOG_DIR/xcodebuild-export.log"
              JOBS="$(sysctl -n hw.ncpu || echo 4)"
              TEAM_ID="$(IOS_TEAM_ID)"
              BUNDLE_ID="$(IOS_BUNDLE_ID)"
              PROV_UUID="$(iosProvProfile.provisioningProfileUuid)"

              (
                while true; do
                  echo "[heartbeat] iOS archive in progress: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  sleep 60
                done
              ) &
              HEARTBEAT_PID=$!

              cleanup_heartbeat() {
                kill "$HEARTBEAT_PID" 2>/dev/null || true
              }
              trap cleanup_heartbeat EXIT

              echo "Archiving with Xcode..."
              if ! RCT_NO_LAUNCH_PACKAGER=1 xcodebuild \
                  -workspace "ios/My Sparklight.xcworkspace" \
                  -scheme "Sparklight Dev" \
                  -configuration Release \
                  -sdk iphoneos \
                  -archivePath "$ARCHIVE_PATH" \
                  -destination "generic/platform=iOS" \
                  -parallelizeTargets \
                  -jobs "$JOBS" \
                  PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
                  CURRENT_PROJECT_VERSION="$(iosBuildNumber)" \
                  CODE_SIGN_STYLE=Manual \
                  DEVELOPMENT_TEAM="$TEAM_ID" \
                  PROVISIONING_PROFILE="$PROV_UUID" \
                  CODE_SIGN_IDENTITY="$(IOS_CODE_SIGN_IDENTITY)" \
                  OTHER_CODE_SIGN_FLAGS="--keychain $(IOS_KEYCHAIN_PATH)" \
                  COMPILER_INDEX_STORE_ENABLE=NO \
                  archive 2>&1 | tee "$ARCHIVE_LOG"; then
                echo "❌ Xcode archive failed"
                grep -i "error:" "$ARCHIVE_LOG" | tail -20 || true
                exit 1
              fi

              EXPORT_OPTS="$(Build.ArtifactStagingDirectory)/exportOptions.plist"
              cat > "$EXPORT_OPTS" <<EOF
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                <key>method</key>
                <string>app-store</string>
                <key>signingStyle</key>
                <string>manual</string>
                <key>teamID</key>
                <string>${TEAM_ID}</string>
                <key>provisioningProfiles</key>
                <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROV_UUID}</string>
                </dict>
                <key>compileBitcode</key>
                <false/>
              </dict>
              </plist>
              EOF

              mkdir -p "$EXPORT_PATH"
              if ! xcodebuild \
                  -exportArchive \
                  -archivePath "$ARCHIVE_PATH" \
                  -exportPath "$EXPORT_PATH" \
                  -exportOptionsPlist "$EXPORT_OPTS" 2>&1 | tee "$EXPORT_LOG"; then
                echo "❌ IPA export failed"
                tail -n 100 "$EXPORT_LOG" || true
                exit 1
              fi

              echo "✅ IPA exported:"
              find "$EXPORT_PATH" -maxdepth 1 -name "*.ipa" -exec ls -lh {} \;
            displayName: 'Xcode archive and export IPA'

          - script: |
              set -euo pipefail
              LOG_DIR="$(Build.ArtifactStagingDirectory)/ios-build-logs"
              mkdir -p "$LOG_DIR"
              echo "=== iOS Build Diagnostics ===" > "$LOG_DIR/diagnostics.txt"
              echo "Result: $(Agent.JobStatus)" >> "$LOG_DIR/diagnostics.txt"
              echo "Build ID: $(Build.BuildId)" >> "$LOG_DIR/diagnostics.txt"
              echo "Branch: $(Build.SourceBranch)" >> "$LOG_DIR/diagnostics.txt"
              echo "Commit: $(Build.SourceVersion)" >> "$LOG_DIR/diagnostics.txt"
              echo "Finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$LOG_DIR/diagnostics.txt"
              ls -la "$(Build.ArtifactStagingDirectory)" >> "$LOG_DIR/diagnostics.txt" || true
            displayName: 'Collect iOS diagnostics'
            condition: always()
            continueOnError: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish iOS build logs'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/ios-build-logs'
              ArtifactName: 'ios-build-logs'
              publishLocation: 'Container'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish IPA artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/ipa'
              ArtifactName: 'ios-ipa'
              publishLocation: 'Container'

  # ==========================================
  # STAGE 5B: IOS STAGING
  # ==========================================

  - stage: CodeReview
    displayName: 'Code Review'
    dependsOn:
      - Build
      - IOSBuild
    condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'Demo'))
    jobs:
      - job: CodeReviewGates
        displayName: 'Code Review Quality Gates'
        steps:
          - checkout: self

          - script: |
              echo "=== Code Review Checklist ==="
              echo "✓ Build Stage: PASSED"
              echo "✓ Unit Tests: PASSED"
              echo "✓ Security Checks: PASSED"
              echo "✓ Lint Quality Checks: PASSED"
              echo "✓ Application-wide Test Cases: PASSED"
              echo ""
              echo "Ready for staging deployment."
            displayName: 'Review Quality Gates'

          - script: |
              echo "Generating Build Report..."
              echo "Build Version: $(androidVersionName)"
              echo "Build Number: $(androidVersionCode)"
              echo "Commit: $(Build.SourceVersion)"
              echo "Branch: $(Build.SourceBranchName)"
              echo "Timestamp: $(Build.StartTime)"
            displayName: 'Generate Build Report'

  # ==========================================
  # STAGE 5: iOS Staging
  # ==========================================

  - stage: IOSStaging
    displayName: 'iOS Staging'
    dependsOn: CodeReview
    condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'Demo'))
    jobs:
      - job: PrepareIOSStaging
        displayName: 'Validate IPA for Staging'
        pool:
          vmImage: 'macos-latest'
        timeoutInMinutes: 45
        cancelTimeoutInMinutes: 10
        steps:
          - download: current
            artifact: ios-ipa
            displayName: 'Download IPA artifact'

          - script: |
              set -euo pipefail
              IPA_PATH=$(find "$(Pipeline.Workspace)/ios-ipa" -maxdepth 1 -type f -name "*.ipa" | head -n 1)
              if [ -z "$IPA_PATH" ]; then
                echo "❌ No IPA found in ios-ipa artifact"
                find "$(Pipeline.Workspace)/ios-ipa" -maxdepth 5 || true
                exit 1
              fi
              echo "✅ IPA validated for staging: $IPA_PATH"
              ls -lh "$IPA_PATH"
            displayName: 'Validate IPA artifact'

  # ==========================================
  # STAGE 6B: IOS TESTFLIGHT
  # ==========================================

  - stage: AndroidStaging
    displayName: 'Android Staging'
    dependsOn: CodeReview
    condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'Demo'))
    jobs:
      - job: PrepareAndroidStaging
        displayName: 'Validate Android AAB for Staging'
        steps:
          - checkout: self

          - task: DownloadBuildArtifacts@0
            displayName: 'Download Android Build Artifacts'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'android-build-$(androidVersionName)'
              downloadPath: '$(Pipeline.Workspace)/android-aab'

          - script: |
              set -euo pipefail
              AAB_PATH=$(find "$(Pipeline.Workspace)/android-aab" -type f -name "*.aab" | head -n 1)
              if [ -z "$AAB_PATH" ]; then
                echo "❌ No AAB found in android artifact"
                find "$(Pipeline.Workspace)/android-aab" -maxdepth 5 || true
                exit 1
              fi
              echo "✅ AAB validated for staging: $AAB_PATH"
              ls -lh "$AAB_PATH"
            displayName: 'Validate Android AAB artifact'

  # ==========================================
  # STAGE 6B: IOS TESTFLIGHT
  # ==========================================

  - stage: IOSTestFlight
    displayName: 'iOS TestFlight'
    dependsOn: IOSStaging
    condition: and(succeeded(), eq('${{ parameters.deployToTestFlight }}', 'true'), or(eq(variables['Build.SourceBranch'], 'refs/heads/Demo'), eq(variables['Build.SourceBranchName'], 'Demo'), eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/Demo'), eq(variables['System.PullRequest.TargetBranch'], 'Demo'), eq(variables['Build.SourceBranch'], 'refs/heads/Dev'), eq(variables['Build.SourceBranchName'], 'Dev'), eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/Dev'), eq(variables['System.PullRequest.TargetBranch'], 'Dev')))
    jobs:
      - job: IOSTestFlightStage
        displayName: 'Upload IPA to TestFlight'
        pool:
          vmImage: 'macos-latest'
        timeoutInMinutes: 90
        cancelTimeoutInMinutes: 10
        steps:
          - download: current
            artifact: ios-ipa
            displayName: 'Download IPA artifact'

          - task: DownloadSecureFile@1
            name: ascApiKey
            displayName: 'Download App Store Connect API key (.p8)'
            inputs:
              secureFile: '$(IOS_ASC_API_KEY_SECUREFILE)'

          - script: |
              set -euo pipefail
              IPA_PATH=$(find "$(Pipeline.Workspace)/ios-ipa" -maxdepth 1 -type f -name "*.ipa" | head -n 1)
              if [ -z "$IPA_PATH" ]; then
                echo "❌ No IPA found in ios-ipa artifact"
                exit 1
              fi

              KEY_PATH="$(ascApiKey.secureFilePath)"
              KEY_FILE_NAME="AuthKey_$(IOS_ASC_API_KEY_ID).p8"
              mkdir -p "$HOME/private_keys" \
                       "$HOME/.private_keys" \
                       "$HOME/.appstoreconnect/private_keys" \
                       "$(Agent.TempDirectory)/private_keys"
              cp "$KEY_PATH" "$HOME/private_keys/$KEY_FILE_NAME"
              cp "$KEY_PATH" "$HOME/.private_keys/$KEY_FILE_NAME"
              cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/$KEY_FILE_NAME"
              cp "$KEY_PATH" "$(Agent.TempDirectory)/private_keys/$KEY_FILE_NAME"

              echo "Uploading $IPA_PATH to TestFlight..."
              xcrun altool \
                --upload-app \
                --type ios \
                --file "$IPA_PATH" \
                --apiKey "$(IOS_ASC_API_KEY_ID)" \
                --apiIssuer "$(IOS_ASC_API_ISSUER_ID)" \
                --show-progress
              echo "✅ IPA submitted to App Store Connect / TestFlight"
            displayName: 'Upload IPA to TestFlight'

          - script: |
              python3 - <<'PYEOF'
              import smtplib, os
              from email.mime.text import MIMEText
              from email.mime.multipart import MIMEMultipart

              smtp_server   = os.environ.get('SMTP_SERVER', '').strip()
              smtp_port     = int(os.environ.get('SMTP_PORT', '587') or '587')
              smtp_user     = os.environ.get('SMTP_USERNAME', '').strip()
              smtp_pass     = os.environ.get('SMTP_PASSWORD', '').strip()
              raw_recipients = os.environ.get('NOTIFICATION_EMAILS', '').strip()
              recipients    = [r.strip() for r in raw_recipients.split(',') if r.strip()]
              ios_version   = os.environ.get('IOS_VERSION_NAME', 'N/A')
              build_num     = os.environ.get('IOS_BUILD_NUMBER', 'N/A')
              branch        = os.environ.get('BUILD_BRANCH', 'N/A')
              commit        = os.environ.get('BUILD_COMMIT', 'N/A')
              bundle_id     = os.environ.get('IOS_BUNDLE_ID', 'N/A')
              pipeline_url  = os.environ.get('BUILD_URL', '')

              if not smtp_server or not smtp_user or not smtp_pass or not recipients:
                  print('Email notification skipped: SMTP credentials or NOTIFICATION_EMAILS not configured.')
                  exit(0)

              msg = MIMEMultipart('alternative')
              msg['From']    = smtp_user
              msg['To']      = ', '.join(recipients)
              msg['Subject'] = f'[MySparklight] iOS v{ios_version} Uploaded to TestFlight'

              body_text = f"""MySparklight Residential - iOS Deployment Notification

              The iOS app has been successfully uploaded to TestFlight.

              Version    : {ios_version}
              Build No   : {build_num}
              Bundle ID  : {bundle_id}
              Branch     : {branch}
              Commit     : {commit}
              Destination: TestFlight (App Store Connect)
              Pipeline   : {pipeline_url}

              This is an automated notification from the Azure DevOps CI/CD pipeline.
              """

              body_html = f"""<html><body>
              <h2 style='color:#1565c0;'>&#x2705; iOS Uploaded to TestFlight</h2>
              <table style='border-collapse:collapse;font-family:Arial,sans-serif;font-size:14px;'>
                <tr><td style='padding:4px 12px;font-weight:bold;'>App</td><td style='padding:4px 12px;'>MySparklight Residential (iOS)</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Version</td><td style='padding:4px 12px;'>{ios_version}</td></tr>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Build No</td><td style='padding:4px 12px;'>{build_num}</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Bundle ID</td><td style='padding:4px 12px;'>{bundle_id}</td></tr>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Branch</td><td style='padding:4px 12px;'>{branch}</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Commit</td><td style='padding:4px 12px;'>{commit}</td></tr>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Destination</td><td style='padding:4px 12px;'>TestFlight (App Store Connect)</td></tr>
              </table>
              <br/><p style='color:#555;font-size:12px;'>This is an automated notification from the Azure DevOps CI/CD pipeline.</p>
              </body></html>"""

              msg.attach(MIMEText(body_text, 'plain'))
              msg.attach(MIMEText(body_html, 'html'))

              try:
                  with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as server:
                      server.ehlo()
                      server.starttls()
                      server.ehlo()
                      server.login(smtp_user, smtp_pass)
                      server.sendmail(smtp_user, recipients, msg.as_string())
                  print(f'Email notification sent to: {recipients}')
              except Exception as e:
                  print(f'Email notification failed: {e}')
                  exit(1)
              PYEOF
            displayName: 'Send iOS TestFlight Email Notification'
            continueOnError: true
            env:
              SMTP_SERVER: $(SMTP_SERVER)
              SMTP_PORT: $(SMTP_PORT)
              SMTP_USERNAME: $(SMTP_USERNAME)
              SMTP_PASSWORD: $(SMTP_PASSWORD)
              NOTIFICATION_EMAILS: $(NOTIFICATION_EMAILS)
              IOS_VERSION_NAME: $(androidVersionName)
              IOS_BUILD_NUMBER: $(iosBuildNumber)
              IOS_BUNDLE_ID: $(IOS_BUNDLE_ID)
              BUILD_BRANCH: $(Build.SourceBranchName)
              BUILD_COMMIT: $(Build.SourceVersion)
              BUILD_URL: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)

  # ==========================================
  # STAGE 2: UNIT TESTS
  # ==========================================

  - stage: InternalTestingDeployment
    displayName: 'Internal Testing Android'
    dependsOn: AndroidStaging
    condition: and(succeeded(), eq('${{ parameters.deployToInternalTesting }}', 'true'), or(eq(variables['Build.SourceBranch'], 'refs/heads/Demo'), eq(variables['Build.SourceBranchName'], 'Demo'), eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/Demo'), eq(variables['System.PullRequest.TargetBranch'], 'Demo'), eq(variables['Build.SourceBranch'], 'refs/heads/Dev'), eq(variables['Build.SourceBranchName'], 'Dev'), eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/Dev'), eq(variables['System.PullRequest.TargetBranch'], 'Dev')))
    jobs:
      - job: DeployToInternalTesting
        displayName: 'Deploy to Play Store Internal Testing'
        steps:
          - checkout: self

          - task: DownloadBuildArtifacts@0
            displayName: 'Download Build Artifacts'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'android-build-$(androidVersionName)'
              downloadPath: '$(System.ArtifactsDirectory)'

          - script: java -version
            displayName: 'Verify Java Installation'

          - script: |
              AAB_PATH=$(find "$(System.ArtifactsDirectory)" -type f -name "*.aab" | head -n 1)
              if [ -z "$AAB_PATH" ]; then
                echo "❌ No AAB file found under $(System.ArtifactsDirectory)"
                find "$(System.ArtifactsDirectory)" -maxdepth 5 -type f | head -n 100
                exit 1
              fi
              echo "Using AAB: $AAB_PATH"
              echo "##vso[task.setvariable variable=AAB_FILE_PATH]$AAB_PATH"
            displayName: 'Resolve AAB for Internal Testing'

          - script: |
              RELEASE_NOTES_FILE="$(Build.ArtifactStagingDirectory)/play-release-notes.txt"
              {
                echo "MySparklight Residential $(androidVersionName)"
                echo "Build: $(androidVersionCode)"
                echo "Branch: $(Build.SourceBranchName)"
                echo "Commit: $(Build.SourceVersion)"
              } > "$RELEASE_NOTES_FILE"
              echo "##vso[task.setvariable variable=GOOGLE_PLAY_RELEASE_NOTES]$RELEASE_NOTES_FILE"
            displayName: 'Generate Play Store release notes'

          - task: ms-vsclient.google-play.google-play-release.GooglePlayRelease@4
            displayName: 'Publish AAB to Play Store Internal Testing'
            inputs:
              serviceConnection: 'PlaystoreRessiConnection'
              applicationId: 'com.sparklight'
              action: 'SingleBundle'
              bundleFile: '$(AAB_FILE_PATH)'
              track: 'internal'
              releaseName: 'MySparklight Residential $(androidVersionName)'
              changeLogFile: '$(GOOGLE_PLAY_RELEASE_NOTES)'

          - script: |
              echo "✅ Internal testing deployment completed successfully"
              echo "Release: $(androidVersionName) ($(androidVersionCode))"
              echo "Status: Uploaded to Google Play Internal Testing"
            displayName: 'Internal Testing Deployment Complete'

          - script: |
              python3 - <<'PYEOF'
              import smtplib, os
              from email.mime.text import MIMEText
              from email.mime.multipart import MIMEMultipart

              smtp_server   = os.environ.get('SMTP_SERVER', '').strip()
              smtp_port     = int(os.environ.get('SMTP_PORT', '587') or '587')
              smtp_user     = os.environ.get('SMTP_USERNAME', '').strip()
              smtp_pass     = os.environ.get('SMTP_PASSWORD', '').strip()
              raw_recipients = os.environ.get('NOTIFICATION_EMAILS', '').strip()
              recipients    = [r.strip() for r in raw_recipients.split(',') if r.strip()]
              version       = os.environ.get('ANDROID_VERSION_NAME', 'N/A')
              build_num     = os.environ.get('ANDROID_VERSION_CODE', 'N/A')
              branch        = os.environ.get('BUILD_BRANCH', 'N/A')
              commit        = os.environ.get('BUILD_COMMIT', 'N/A')
              pipeline_url  = os.environ.get('BUILD_URL', '')

              if not smtp_server or not smtp_user or not smtp_pass or not recipients:
                  print('Email notification skipped: SMTP credentials or NOTIFICATION_EMAILS not configured.')
                  exit(0)

              msg = MIMEMultipart('alternative')
              msg['From']    = smtp_user
              msg['To']      = ', '.join(recipients)
              msg['Subject'] = f'[MySparklight] Android v{version} Deployed to Play Store Internal Testing'

              body_text = f"""MySparklight Residential - Android Deployment Notification

              The Android app has been successfully deployed to Google Play Store Internal Testing.

              Version  : {version}
              Build No : {build_num}
              Branch   : {branch}
              Commit   : {commit}
              Track    : Internal Testing
              Pipeline : {pipeline_url}

              This is an automated notification from the Azure DevOps CI/CD pipeline.
              """

              body_html = f"""<html><body>
              <h2 style='color:#2e7d32;'>&#x2705; Android Deployed to Play Store Internal Testing</h2>
              <table style='border-collapse:collapse;font-family:Arial,sans-serif;font-size:14px;'>
                <tr><td style='padding:4px 12px;font-weight:bold;'>App</td><td style='padding:4px 12px;'>MySparklight Residential (Android)</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Version</td><td style='padding:4px 12px;'>{version}</td></tr>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Build No</td><td style='padding:4px 12px;'>{build_num}</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Branch</td><td style='padding:4px 12px;'>{branch}</td></tr>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Commit</td><td style='padding:4px 12px;'>{commit}</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Track</td><td style='padding:4px 12px;'>Internal Testing</td></tr>
              </table>
              <br/><p style='color:#555;font-size:12px;'>This is an automated notification from the Azure DevOps CI/CD pipeline.</p>
              </body></html>"""

              msg.attach(MIMEText(body_text, 'plain'))
              msg.attach(MIMEText(body_html, 'html'))

              try:
                  with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as server:
                      server.ehlo()
                      server.starttls()
                      server.ehlo()
                      server.login(smtp_user, smtp_pass)
                      server.sendmail(smtp_user, recipients, msg.as_string())
                  print(f'Email notification sent to: {recipients}')
              except Exception as e:
                  print(f'Email notification failed: {e}')
                  exit(1)
              PYEOF
            displayName: 'Send Android Deployment Email Notification'
            continueOnError: true
            env:
              SMTP_SERVER: $(SMTP_SERVER)
              SMTP_PORT: $(SMTP_PORT)
              SMTP_USERNAME: $(SMTP_USERNAME)
              SMTP_PASSWORD: $(SMTP_PASSWORD)
              NOTIFICATION_EMAILS: $(NOTIFICATION_EMAILS)
              ANDROID_VERSION_NAME: $(androidVersionName)
              ANDROID_VERSION_CODE: $(androidVersionCode)
              BUILD_BRANCH: $(Build.SourceBranchName)
              BUILD_COMMIT: $(Build.SourceVersion)
              BUILD_URL: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
