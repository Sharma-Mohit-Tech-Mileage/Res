trigger:
- cicd_pipeline

pool:
  vmImage: 'ubuntu-latest'

variables:
- name: keyAlias
  value: residential
- name: jarsignerKeystorePassword
  value: sparklight_123
- name: jarsignerKeyPassword
  value: sparklight_123
- name: androidVersionCode
  value: $[counter('androidBuildVersionStore', 23024)]
- name: androidVersionName
  value: '25.5.0'

steps:
- task: JavaToolInstaller@0
  displayName: 'Install JDK 17'
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- script: java -version
  displayName: 'Check Java Version'

- task: NodeTool@0
  displayName: 'Install Node'
  inputs:
    versionSpec: '20.6.1'

- script: npm cache clean --force
  displayName: 'Clean npm cache'

- script: npm install --legacy-peer-deps
  displayName: 'Install node dependencies'

- task: DownloadSecureFile@1
  name: keystoreFile
  displayName: 'Download Keystore File'
  inputs:
    secureFile: 'Residentialkey.jks'

- task: Gradle@4
  displayName: 'Build Android App Bundle'
  inputs:
    workingDirectory: 'android'
    gradleWrapperFile: 'android/gradlew'
    tasks: 'clean bundleDemoRelease'
    options: >
      -PKEYSTORE_PATH=$(keystoreFile.secureFilePath)
      -PKEYSTORE_PASSWORD=$(jarsignerKeystorePassword)
      -PKEY_ALIAS=$(keyAlias)
      -PKEY_PASSWORD=$(jarsignerKeyPassword)
      -PVERSION_CODE=$(androidVersionCode)
      -PVERSION_NAME=$(androidVersionName)
    publishJUnitResults: false

- task: CopyFiles@2
  displayName: 'Copy Android App Artifacts'
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)/android/app/build/outputs'
    Contents: '**/*.aab'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/drop'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifacts'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
    ArtifactName: 'drop'
    publishLocation: 'Container'
    
- script: |
    keytool -printcert -jarfile $(System.DefaultWorkingDirectory)/android/app/build/outputs/bundle/DemoRelease/app-Demo-release.aab
  displayName: 'Verify AAB certificate'

- task: ms-vsclient.google-play.google-play-release.GooglePlayRelease@4
  displayName: 'Publish AAB to Google Play (Internal Track)'
  inputs:
    serviceConnection: 'PlayStorResidentialConnection'
    applicationId: 'com.sparklight.customer.app'
    action: 'SingleBundle'
    bundleFile: '$(System.DefaultWorkingDirectory)/android/app/build/outputs/bundle/DemoRelease/app-Demo-release.aab'
    track: 'internal'
    releaseName: 'MySparklight Residential $(androidVersionName)'