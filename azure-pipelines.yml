parameters:
  - name: agentPool
    displayName: Build agent (auto uses Azure requester email)
    type: string
    default: auto
    values:
      - auto
      - Sparklight-Mac
      - Azure Pipelines
  - name: runSecurityChecks
    displayName: Run Security Checks
    type: boolean
    default: true
  - name: enforceFullCoverage
    displayName: Enforce 100% Coverage
    type: boolean
    default: false
  - name: minCoveragePercent
    displayName: Minimum Coverage Percent (default when not full mode)
    type: number
    default: 90
  - name: deployToInternalTesting
    displayName: Deploy to Internal Testing
    type: boolean
    default: true
  - name: deployToTestFlight
    displayName: Deploy to TestFlight
    type: boolean
    default: true
trigger:
  branches:
    include:
      - Dev
      - Demo
      - main
      - main-dev
      - Sparklight
pr:
  autoCancel: true
  branches:
    include:
      - Dev
      - Demo
      - main
      - main-dev
      - Sparklight
variables:
  - name: NPM_CONFIG_CACHE
    value: $(Pipeline.Workspace)/.npm
  - name: GRADLE_USER_HOME
    value: $(Pipeline.Workspace)/.gradle
  - name: keyAlias
    value: sparklight
  - name: jarsignerKeystorePassword
    value: sparklight_123
  - name: jarsignerKeyPassword
    value: sparklight_123
  - name: androidVersionName
    value: 30.0.1
  - name: iosVersionName
    value: $(androidVersionName)
  - name: NPM_CONFIG_LEGACY_PEER_DEPS
    value: "true"
  - name: IOS_CERT_PASSWORD
    value: Sparklight@123
  - name: IOS_TEAM_ID
    value: W486HD85BD
  - name: IOS_P12_CERT
    value: Sparklight_Bussiness_p12.p12
  - name: IOS_CODE_SIGN_IDENTITY
    value: Apple Distribution
  - name: IOS_BUNDLE_ID
    value: com.sparklight.customer.app
  - name: IOS_PROV_PROFILE_SECUREFILE
    value: Sparklight_Residential_Profile.mobileprovision
  - name: IOS_ASC_API_KEY_ID
    value: WH2L3V82PA
  - name: IOS_ASC_API_ISSUER_ID
    value: 69a6de96-8e47-47e3-e053-5b8c7c11a4d1
  - name: IOS_ASC_API_KEY_SECUREFILE
    value: AuthKey_WH2L3V82PA.p8
  - name: IOS_REQUIRED_XCODE_MAJOR
    value: "26"
  - name: NOTIFICATION_EMAILS
    value: Mohit.Sharma@cableone.biz
  - name: DEMO_NOTIFICATION_EMAILS
    value: Mohit.Sharma@cableone.biz,mohit.sharma@sciata.com
  - name: SMTP_SERVER
    value: ""
  - name: SMTP_PORT
    value: "587"
  - name: RUN_SECURITY_CHECKS
    value: ${{ parameters.runSecurityChecks }}
  - name: ENFORCE_FULL_COVERAGE
    value: ${{ parameters.enforceFullCoverage }}
  - name: MIN_COVERAGE_PERCENT
    value: ${{ parameters.minCoveragePercent }}
  - name: DEPLOY_TO_INTERNAL_TESTING
    value: ${{ parameters.deployToInternalTesting }}
  - name: DEPLOY_TO_TESTFLIGHT
    value: ${{ parameters.deployToTestFlight }}
  - name: INTERNAL_RELEASE_NOTES
    value: Automated build from $(Build.SourceBranchName)
  - name: androidVersionCode
    value: $[counter('androidBuildVersionStore-v2', 531)]
  - name: ANDROID_UPLOAD_CERT_SHA1
    value: 53:91:E0:AC:75:92:E7:BD:4F:2A:24:6C:D3:66:7E:37:2D:3C:45:2A
stages:
  - stage: Setup
    displayName: 01 · Setup & Version
    dependsOn: []
    condition: succeeded()
    jobs:
      - job: SetupJob
        displayName: 01 · Setup & Version
        timeoutInMinutes: 10
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0
          - bash: |
              set -euo pipefail
              printf "Agent selection: %s\nRequested for: %s\nRequester email: %s\nRequester ID: %s\nAgent: %s\nMachine: %s\n" "$POOL_SELECTION" "$BUILD_REQUESTEDFOR" "$BUILD_REQUESTEDFOREMAIL" "$BUILD_REQUESTEDFORID" "$AGENT_NAME" "$AGENT_MACHINENAME"
            displayName: Show agent routing and Azure requester identity
            env:
              POOL_SELECTION: ${{ parameters.agentPool }}
          - script: python3 scripts/ci/release-notes.py
            displayName: Generate release notes and PR text from source commit
          - task: PublishBuildArtifacts@1
            displayName: Publish release notes and PR text
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/release-notes
              ArtifactName: release-notes
              publishLocation: Container
          - task: NodeTool@0
            inputs:
              versionSpec: 20.x
            displayName: Use Node for store version lookup
          - task: DownloadSecureFile@1
            name: versionAppleKey
            inputs:
              secureFile: $(IOS_ASC_API_KEY_SECUREFILE)
            displayName: Download Apple version lookup key
          - script: node scripts/ci/store-build-versions.cjs
            name: storeVersions
            displayName: Read App Store Connect build number and add 1
            env:
              ASC_KEY_PATH: $(versionAppleKey.secureFilePath)
              ASC_KEY_ID: $(IOS_ASC_API_KEY_ID)
              ASC_ISSUER_ID: $(IOS_ASC_API_ISSUER_ID)
              APP_BUNDLE_ID: $(IOS_BUNDLE_ID)
              IOS_MARKETING_VERSION: $(iosVersionName)
          - script: |
              echo "=== Initial Commit Validation ==="
              echo "Reason: $(Build.Reason)"
              echo "Branch: $(Build.SourceBranchName)"
              echo "Source Branch Ref: $(Build.SourceBranch)"
              echo "PR Target Branch: ${SYSTEM_PULLREQUEST_TARGETBRANCH:-}"
              echo "Commit: $(Build.SourceVersion)"
              echo "Requested by: $(Build.RequestedFor)"
              echo "Pipeline stages run sequentially, with one active job at a time."

              echo "Release notes are optional; deployment stages will use the configured default when none are supplied."
            displayName: Validate Initial Commit Metadata
          - script: |
              VERSION_NAME="$(androidVersionName)"
              echo "Extracted VERSION_NAME: $VERSION_NAME"
              echo "##vso[task.setvariable variable=PROJECT_VERSION_NAME]$VERSION_NAME"

              if [[ "$(Build.SourceBranchName)" == "Prod" || "$(Build.SourceBranchName)" == "prod" || "$(Build.SourceBranchName)" == "main" ]]; then
                DEPLOY_ENV="PRODUCTION"
                API_URL="https://api.sparklight.com"
              else
                DEPLOY_ENV="STAGING"
                API_URL="https://staging-api.sparklight.com"
              fi

              echo "##vso[task.setvariable variable=DEPLOY_ENV]$DEPLOY_ENV"
              echo "##vso[task.setvariable variable=API_ENDPOINT]$API_URL"
            displayName: Extract project version and set environment variables
          - script: |
              VERSION_INFO_DIR="$(Build.ArtifactStagingDirectory)/version-info"
              mkdir -p "$VERSION_INFO_DIR"
              cat > "$VERSION_INFO_DIR/version-info.json" <<EOF
              {
                "androidVersionCode": $(androidVersionCode),
                "iosBuildNumber": $(iosBuildNumber)
              }
              EOF
              cat "$VERSION_INFO_DIR/version-info.json"
            displayName: Write version info artifact
          - task: PublishBuildArtifacts@1
            displayName: Publish version info artifact
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/version-info
              ArtifactName: version-info
              publishLocation: Container
          - script: |
              python3 - <<'PYEOF'
              import os, smtplib
              from email.mime.text import MIMEText
              from email.mime.multipart import MIMEMultipart

              smtp_server = os.environ.get('SMTP_SERVER', '').strip()
              smtp_port = int(os.environ.get('SMTP_PORT', '587') or '587')
              smtp_user = os.environ.get('SMTP_USERNAME', '').strip()
              smtp_pass = os.environ.get('SMTP_PASSWORD', '').strip()
              branch = os.environ.get('BUILD_BRANCH', 'N/A')
              commit = os.environ.get('BUILD_COMMIT', 'N/A')
              reason = os.environ.get('BUILD_REASON', 'N/A')
              url = os.environ.get('BUILD_URL', '')
              recipients = [r.strip() for r in os.environ.get('DEMO_NOTIFICATION_EMAILS', '').split(',') if r.strip()]

              if not smtp_server or not smtp_user or not smtp_pass or not recipients:
                  print('Initial commit email skipped: SMTP credentials or DEMO_NOTIFICATION_EMAILS not configured.')
                  exit(0)

              msg = MIMEMultipart('alternative')
              msg['From'] = smtp_user
              msg['To'] = ', '.join(recipients)
              msg['Subject'] = f'[MySparklight] Demo branch build started: {branch}'

              body_text = f"""MySparklight Residential - Demo build started.

              Branch: {branch}
              Commit: {commit}
              Reason: {reason}
              Pipeline: {url}
              """

              body_html = f"""<html><body>
              <h2>Demo build started</h2>
              <p>Branch: {branch}<br>
              Commit: {commit}<br>
              Reason: {reason}</p>
              <p>Pipeline: <a href=\"{url}\">{url}</a></p>
              </body></html>"""

              msg.attach(MIMEText(body_text, 'plain'))
              msg.attach(MIMEText(body_html, 'html'))

              with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as server:
                  server.ehlo()
                  server.starttls()
                  server.ehlo()
                  server.login(smtp_user, smtp_pass)
                  server.sendmail(smtp_user, recipients, msg.as_string())

              print('Initial commit notification sent to: ' + ', '.join(recipients))
              PYEOF
            displayName: Send initial commit email
            condition: eq(variables['Build.SourceBranchName'], 'Demo')
            env:
              SMTP_SERVER: $(SMTP_SERVER)
              SMTP_PORT: $(SMTP_PORT)
              SMTP_USERNAME: $(SMTP_USERNAME)
              SMTP_PASSWORD: $(SMTP_PASSWORD)
              DEMO_NOTIFICATION_EMAILS: $(DEMO_NOTIFICATION_EMAILS)
              BUILD_BRANCH: $(Build.SourceBranchName)
              BUILD_COMMIT: $(Build.SourceVersion)
              BUILD_REASON: $(Build.Reason)
              BUILD_URL: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
        ${{ if or(eq(parameters.agentPool, 'Sparklight-Mac'), and(eq(parameters.agentPool, 'auto'), eq(variables['Build.RequestedForEmail'], 'Mohit.Sharma@cableone.biz'))) }}:
          pool:
            name: Sparklight-Mac
            demands:
              - Agent.OS -equals Darwin
              - Agent.OSArchitecture -equals ARM64
        ${{ else }}:
          pool:
            name: Azure Pipelines
            vmImage: macos-latest
  - stage: Tests
    displayName: 02 · Tests & Coverage
    dependsOn:
      - Setup
    condition: succeeded()
    jobs:
      - job: TestsJob
        displayName: 02 · Tests & Coverage
        timeoutInMinutes: 20
        steps:
          - checkout: self
            clean: true
          - template: pipelines/templates/cache-gradle.yml
          - script: |
              set -euo pipefail
              JDK_PATH=$(/usr/libexec/java_home -v 17)
              echo "##vso[task.setvariable variable=JAVA_HOME]$JDK_PATH"
              echo "##vso[task.prependpath]$JDK_PATH/bin"
              "$JDK_PATH/bin/java" -version
            displayName: Select installed JDK 17
          - task: NodeTool@0
            displayName: Install Node 20.x
            inputs:
              versionSpec: 20.x
          - template: pipelines/templates/cache-npm.yml
          - script: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
            displayName: Install Dependencies
          - script: |
              set -euo pipefail
              if [ ! -f node_modules/native-base/lib/commonjs/components/composites/AspectRatio/index.js ]; then
                echo "NativeBase install is incomplete; reinstalling the locked package."
                rm -rf node_modules/native-base
                npm install --no-save --legacy-peer-deps --prefer-offline --no-audit native-base@3.4.28
              fi
              test -f node_modules/native-base/lib/commonjs/components/composites/AspectRatio/index.js
            displayName: Verify NativeBase installation
          - script: |
              echo "Running application-wide Jest test cases..."
              npx jest --ci --coverage --watchAll=false --passWithNoTests --reporters=default --reporters=jest-junit
            displayName: Run App-wide Jest Test Cases
            workingDirectory: .
          - script: |
              set -euo pipefail
              export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
              export PATH="$JAVA_HOME/bin:$PATH"
              cd android
              # Test/assertion failures are deterministic: fail once instead of rebuilding three times.
              ./gradlew testDemoReleaseUnitTest --daemon --build-cache --parallel
            displayName: Run Android Unit Tests
          - script: |
              node -e "const fs=require('fs'); const p='coverage/coverage-summary.json'; if(!fs.existsSync(p)){console.error('coverage-summary.json not found'); process.exit(1);} const data=JSON.parse(fs.readFileSync(p,'utf8')); const t=data.total||{}; const keys=['lines','statements','functions','branches']; const fullRaw=String('$(ENFORCE_FULL_COVERAGE)'); const full=fullRaw.toLowerCase()==='true'; const minRaw=String('$(MIN_COVERAGE_PERCENT)'); const min=Number(minRaw); const target=full?100:(Number.isFinite(min)?min:0); let failed=false; console.log('Coverage mode: '+(full?'strict':'threshold')); console.log('Coverage target: '+target+'%'); for(const k of keys){const pct=Number((t[k]||{}).pct||0); console.log(k+': '+pct+'%'); if(pct<target){failed=true;}} if(failed){console.error('Coverage gate failed: required '+target+'% for lines/statements/functions/branches.'); process.exit(1);} console.log('Coverage gate passed.');"
            displayName: Enforce Coverage Gate
          - task: PublishTestResults@2
            displayName: Publish Android/Jest Test Results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "**/junit.xml,**/build/test-results/**/*.xml"
              searchFolder: $(System.DefaultWorkingDirectory)
              mergeTestResults: true
              failTaskOnFailedTests: false
          - task: PublishBuildArtifacts@1
            displayName: Publish Coverage Reports
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: $(System.DefaultWorkingDirectory)/coverage
              ArtifactName: coverage-reports
              publishLocation: Container
        ${{ if or(eq(parameters.agentPool, 'Sparklight-Mac'), and(eq(parameters.agentPool, 'auto'), eq(variables['Build.RequestedForEmail'], 'Mohit.Sharma@cableone.biz'))) }}:
          pool:
            name: Sparklight-Mac
            demands:
              - Agent.OS -equals Darwin
              - Agent.OSArchitecture -equals ARM64
        ${{ else }}:
          pool:
            name: Azure Pipelines
            vmImage: macos-latest
    variables:
      iosBuildNumber: $[stageDependencies.Setup.SetupJob.outputs['storeVersions.iosBuildNumber']]
  - stage: Quality
    displayName: 03 · Quality & Security
    dependsOn:
      - Tests
      - Setup
    condition: succeeded()
    jobs:
      - job: QualityJob
        displayName: 03 · Quality & Security
        timeoutInMinutes: 20
        steps:
          - checkout: self
            clean: true
          - template: pipelines/templates/cache-gradle.yml
          - script: |
              set -euo pipefail
              JDK_PATH=$(/usr/libexec/java_home -v 17)
              echo "##vso[task.setvariable variable=JAVA_HOME]$JDK_PATH"
              echo "##vso[task.prependpath]$JDK_PATH/bin"
              "$JDK_PATH/bin/java" -version
            displayName: Select installed JDK 17
          - task: NodeTool@0
            displayName: Install Node 20.x
            inputs:
              versionSpec: 20.x
          - template: pipelines/templates/cache-npm.yml
          - script: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
            displayName: Install Dependencies
          - script: |
              set -euo pipefail
              if [ ! -f node_modules/native-base/lib/commonjs/components/composites/AspectRatio/index.js ]; then
                echo "NativeBase install is incomplete; reinstalling the locked package."
                rm -rf node_modules/native-base
                npm install --no-save --legacy-peer-deps --prefer-offline --no-audit native-base@3.4.28
              fi
              test -f node_modules/native-base/lib/commonjs/components/composites/AspectRatio/index.js
            displayName: Verify NativeBase installation
          - script: |
              echo "Running ESLint analysis..."
              npx eslint src/ --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true
            displayName: Run ESLint
            continueOnError: true
          - script: |
              echo "Running Prettier check..."
              npx prettier --check src/ 2>&1 | tee prettier-report.txt || true
            displayName: Run Prettier Check
            continueOnError: true
          - script: |
              REPORT_DIR="$(Build.ArtifactStagingDirectory)/lint-reports"
              mkdir -p "$REPORT_DIR"

              if [ -f "$(System.DefaultWorkingDirectory)/eslint-report.json" ]; then
                cp "$(System.DefaultWorkingDirectory)/eslint-report.json" "$REPORT_DIR/"
              fi

              if [ -f "$(System.DefaultWorkingDirectory)/prettier-report.txt" ]; then
                cp "$(System.DefaultWorkingDirectory)/prettier-report.txt" "$REPORT_DIR/"
              fi

              if [ -z "$(find "$REPORT_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "No lint report files were generated." > "$REPORT_DIR/lint-summary.txt"
              fi
            displayName: Stage Lint Reports
          - task: PublishBuildArtifacts@1
            displayName: Publish Lint Reports
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/lint-reports
              ArtifactName: lint-reports
              publishLocation: Container
          - script: |
              npm audit --audit-level=moderate --json --package-lock-only > npm-audit-report.json || true
            displayName: Run npm Audit (iOS Path)
            continueOnError: true
          - script: |
              set -euo pipefail

              LINT_DIR="$(Build.ArtifactStagingDirectory)/ios-lint-stage"
              SEC_DIR="$(Build.ArtifactStagingDirectory)/ios-security-stage"
              mkdir -p "$LINT_DIR" "$SEC_DIR"

              if [ -f "$(System.DefaultWorkingDirectory)/eslint-report.json" ]; then
                cp "$(System.DefaultWorkingDirectory)/eslint-report.json" "$LINT_DIR/"
              fi

              if [ -f "$(System.DefaultWorkingDirectory)/prettier-report.txt" ]; then
                cp "$(System.DefaultWorkingDirectory)/prettier-report.txt" "$LINT_DIR/"
              fi

              if [ -f "$(System.DefaultWorkingDirectory)/npm-audit-report.json" ]; then
                cp "$(System.DefaultWorkingDirectory)/npm-audit-report.json" "$SEC_DIR/"
              fi

              if [ -z "$(find "$LINT_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "No lint files." > "$LINT_DIR/lint-summary.txt"
              fi

              if [ -z "$(find "$SEC_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "No security files." > "$SEC_DIR/security-summary.txt"
              fi
            displayName: Stage iOS Security and Lint Reports
          - task: PublishBuildArtifacts@1
            displayName: Publish iOS Lint Stage Reports
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/ios-lint-stage
              ArtifactName: ios-lint-stage-reports
              publishLocation: Container
          - task: PublishBuildArtifacts@1
            displayName: Publish iOS Security Stage Reports
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/ios-security-stage
              ArtifactName: ios-security-stage-reports
              publishLocation: Container
          - script: |
              echo "Installing dependency-check..."
              set +e
              ZIP_FILE="dependency-check-release.zip"
              CANDIDATE_URLS=(
                "https://github.com/jeremylong/DependencyCheck/releases/latest/download/dependency-check-release.zip"
                "https://github.com/jeremylong/DependencyCheck_Home/releases/latest/download/dependency-check-release.zip"
              )

              DOWNLOADED="false"
              for URL in "${CANDIDATE_URLS[@]}"; do
                echo "Trying: $URL"
                if curl -fsSL "$URL" -o "$ZIP_FILE"; then
                  DOWNLOADED="true"
                  break
                fi
              done

              if [ "$DOWNLOADED" = "true" ]; then
                unzip -oq "$ZIP_FILE"
                if [ -x "$(pwd)/dependency-check/bin/dependency-check.sh" ]; then
                  "$(pwd)/dependency-check/bin/dependency-check.sh" --version || true
                else
                  echo "dependency-check extracted but executable not found; will skip scan."
                fi
              else
                echo "Dependency-Check download failed from all candidate URLs; scan step will be skipped."
              fi
            displayName: Setup Dependency-Check
            continueOnError: true
            condition: and(succeeded(), eq(variables['RUN_SECURITY_CHECKS'], 'true'))
          - script: |
              REPORT_DIR="$(System.DefaultWorkingDirectory)/dependency-check-report"
              mkdir -p "$REPORT_DIR"

              if [ ! -x "$(pwd)/dependency-check/bin/dependency-check.sh" ]; then
                echo "{\"status\":\"skipped\",\"reason\":\"dependency-check unavailable\"}" > "$(System.DefaultWorkingDirectory)/dependency-check-report.json"
                echo "Dependency-Check not available; vulnerability scan skipped."
                exit 0
              fi

              "$(pwd)/dependency-check/bin/dependency-check.sh" \
                --scan "$(System.DefaultWorkingDirectory)" \
                --format JSON \
                --project "MySparklight Residential App" \
                --out "$REPORT_DIR" || echo "Dependency check completed with warnings"

              if [ -f "$REPORT_DIR/dependency-check-report.json" ]; then
                cp "$REPORT_DIR/dependency-check-report.json" "$(System.DefaultWorkingDirectory)/dependency-check-report.json"
              fi
            displayName: Run Dependency Check (Vulnerability Scanning)
            continueOnError: true
            condition: and(succeeded(), eq(variables['RUN_SECURITY_CHECKS'], 'true'))
          - script: |
              if [ -f "npm-audit-report.json" ]; then
                echo "=== NPM Audit Report ==="
                cat npm-audit-report.json
              fi
              if [ -f "dependency-check-report.json" ]; then
                echo "=== Dependency Check Report ==="
                python3 -m json.tool dependency-check-report.json | head -50
              fi
            displayName: Display Security Reports
            continueOnError: true
            condition: and(succeeded(), eq(variables['RUN_SECURITY_CHECKS'], 'true'))
          - script: |
              REPORT_DIR="$(Build.ArtifactStagingDirectory)/security-reports"
              mkdir -p "$REPORT_DIR"

              if [ -f "$(System.DefaultWorkingDirectory)/npm-audit-report.json" ]; then
                cp "$(System.DefaultWorkingDirectory)/npm-audit-report.json" "$REPORT_DIR/"
              fi

              if [ -f "$(System.DefaultWorkingDirectory)/dependency-check-report.json" ]; then
                cp "$(System.DefaultWorkingDirectory)/dependency-check-report.json" "$REPORT_DIR/"
              fi

              if [ -z "$(find "$REPORT_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "No security report files were generated." > "$REPORT_DIR/security-summary.txt"
              fi
            displayName: Stage Security Reports
            condition: and(succeeded(), eq(variables['RUN_SECURITY_CHECKS'], 'true'))
          - task: PublishBuildArtifacts@1
            displayName: Publish Security Reports
            condition: and(succeededOrFailed(), eq(variables['RUN_SECURITY_CHECKS'], 'true'))
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/security-reports
              ArtifactName: security-reports
              publishLocation: Container
          - script: |
              cd android
              ./gradlew lintDemoRelease --daemon --build-cache --parallel || true
            displayName: Run Android Lint
            continueOnError: true
          - script: |
              SOURCE_DIR="$(System.DefaultWorkingDirectory)/android/app/build/reports"
              REPORT_DIR="$(Build.ArtifactStagingDirectory)/android-lint-reports"
              mkdir -p "$REPORT_DIR"

              if [ -d "$SOURCE_DIR" ]; then
                cp -R "$SOURCE_DIR"/. "$REPORT_DIR/" || true
              fi

              if [ -z "$(find "$REPORT_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "Lint reports may be unavailable if lint did not produce report files." > "$REPORT_DIR/lint-summary.txt"
              fi
            displayName: Stage Android lint reports
          - task: PublishBuildArtifacts@1
            displayName: Publish Android Lint Reports
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/android-lint-reports
              ArtifactName: android-lint-reports
              publishLocation: Container
        ${{ if or(eq(parameters.agentPool, 'Sparklight-Mac'), and(eq(parameters.agentPool, 'auto'), eq(variables['Build.RequestedForEmail'], 'Mohit.Sharma@cableone.biz'))) }}:
          pool:
            name: Sparklight-Mac
            demands:
              - Agent.OS -equals Darwin
              - Agent.OSArchitecture -equals ARM64
        ${{ else }}:
          pool:
            name: Azure Pipelines
            vmImage: macos-latest
    variables:
      iosBuildNumber: $[stageDependencies.Setup.SetupJob.outputs['storeVersions.iosBuildNumber']]
  - stage: AndroidBuild
    displayName: 04 · Android Build
    dependsOn:
      - Quality
      - Setup
    condition: succeeded()
    jobs:
      - job: AndroidBuildJob
        displayName: 04 · Android Build
        timeoutInMinutes: 30
        steps:
          - checkout: self
            clean: true
          - template: pipelines/templates/cache-gradle.yml
          - script: |
              set -euo pipefail
              JDK_PATH=$(/usr/libexec/java_home -v 17)
              echo "##vso[task.setvariable variable=JAVA_HOME]$JDK_PATH"
              echo "##vso[task.prependpath]$JDK_PATH/bin"
              "$JDK_PATH/bin/java" -version
            displayName: Select installed JDK 17
          - task: NodeTool@0
            displayName: Install Node 20.x
            inputs:
              versionSpec: 20.x
          - template: pipelines/templates/cache-npm.yml
          - script: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
            displayName: Install Dependencies
          - script: |
              set -euo pipefail
              if [ ! -f node_modules/native-base/lib/commonjs/components/composites/AspectRatio/index.js ]; then
                echo "NativeBase install is incomplete; reinstalling the locked package."
                rm -rf node_modules/native-base
                npm install --no-save --legacy-peer-deps --prefer-offline --no-audit native-base@3.4.28
              fi
              test -f node_modules/native-base/lib/commonjs/components/composites/AspectRatio/index.js
            displayName: Verify NativeBase installation
          - script: java -version
            displayName: Check Java Version
          - task: DownloadSecureFile@1
            name: keystoreFile
            displayName: Download Keystore File
            inputs:
              secureFile: Sparklight.keystore
          - script: |
              set -euo pipefail
              KEYSTORE_PATH="$(keystoreFile.secureFilePath)"
              EXPECTED_SHA1="$(ANDROID_UPLOAD_CERT_SHA1)"

              ACTUAL_SHA1=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$(keyAlias)" -storepass "$(jarsignerKeystorePassword)" -keypass "$(jarsignerKeyPassword)" | sed -n 's/^.*SHA1:[[:space:]]*\(.*\)$/\1/p' | head -n1 | tr -d '[:space:]')
              EXPECTED_NORMALIZED=$(echo "$EXPECTED_SHA1" | tr -d '[:space:]')

              echo "Resolved upload key SHA1: $ACTUAL_SHA1"
              echo "Expected upload key SHA1: $EXPECTED_NORMALIZED"

              if [ -z "$ACTUAL_SHA1" ]; then
                echo "❌ Could not read SHA1 fingerprint from keystore alias $(keyAlias)."
                exit 1
              fi

              if [ "$ACTUAL_SHA1" != "$EXPECTED_NORMALIZED" ]; then
                echo "❌ Keystore fingerprint mismatch."
                echo "The uploaded keystore does not match the Google Play upload key for package com.sparklight."
                exit 1
              fi

              echo "✅ Keystore fingerprint matches expected Play upload key."
            displayName: Validate Android upload keystore fingerprint
          - script: |
              set -euo pipefail
              TARGET_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH:-}"
              SOURCE_BRANCH="${BUILD_SOURCEBRANCHNAME:-}"
              CHANNEL="Demo"
              ANDROID_TASK="bundleDemoRelease"

              if [ "${BUILD_REASON:-}" = "PullRequest" ]; then
                case "$TARGET_BRANCH" in
                  refs/heads/Dev|Dev)
                    CHANNEL="Demo"
                    ANDROID_TASK="bundleDemoRelease"
                    ;;
                  refs/heads/Demo|Demo)
                    CHANNEL="Demo"
                    ANDROID_TASK="bundleDemoRelease"
                    ;;
                  refs/heads/Prod|Prod|refs/heads/prod|prod|refs/heads/main|main)
                    CHANNEL="Prod"
                    ANDROID_TASK="bundleProdRelease"
                    ;;
                esac
              else
                case "$SOURCE_BRANCH" in
                  Dev)
                    CHANNEL="Demo"
                    ANDROID_TASK="bundleDemoRelease"
                    ;;
                  Demo)
                    CHANNEL="Demo"
                    ANDROID_TASK="bundleDemoRelease"
                    ;;
                  Prod|prod|main)
                    CHANNEL="Prod"
                    ANDROID_TASK="bundleProdRelease"
                    ;;
                esac
              fi

              echo "Resolved channel: $CHANNEL"
              echo "Resolved Android task: $ANDROID_TASK"
              echo "##vso[task.setvariable variable=RELEASE_CHANNEL]$CHANNEL"
              echo "##vso[task.setvariable variable=ANDROID_BUILD_TASK]$ANDROID_TASK"
            displayName: Resolve release channel and Android flavor
          - script: |
              set -euo pipefail
              COMPUTED_VERSION_CODE="$(androidVersionCode)"
              if ! [[ "$COMPUTED_VERSION_CODE" =~ ^[0-9]+$ ]]; then
                echo "❌ Invalid Android version code: $COMPUTED_VERSION_CODE"
                exit 1
              fi
              echo "Computed VERSION_CODE: $COMPUTED_VERSION_CODE"
              echo "##vso[task.setvariable variable=COMPUTED_VERSION_CODE]$COMPUTED_VERSION_CODE"
            displayName: Resolve Android VERSION_CODE
          - task: Gradle@4
            displayName: Build Android App Bundle (Branch Release)
            inputs:
              workingDirectory: android
              gradleWrapperFile: android/gradlew
              tasks: $(ANDROID_BUILD_TASK)
              options: |
                --daemon --build-cache --parallel -PKEYSTORE_PATH=$(keystoreFile.secureFilePath) -PKEYSTORE_PASSWORD=$(jarsignerKeystorePassword) -PKEY_ALIAS=$(keyAlias) -PKEY_PASSWORD=$(jarsignerKeyPassword) -PVERSION_CODE=$(COMPUTED_VERSION_CODE) -PVERSION_NAME=$(androidVersionName)
              publishJUnitResults: false
          - script: |
              set -euo pipefail
              AAB_PATH=$(find "$(System.DefaultWorkingDirectory)/android/app/build/outputs/bundle" -type f -name "*.aab" | head -n 1)
              if [ -z "$AAB_PATH" ]; then
                echo "❌ No AAB found after build"
                find "$(System.DefaultWorkingDirectory)/android/app/build/outputs" -maxdepth 5 -type f | sort
                exit 1
              fi
              echo "Built AAB: $AAB_PATH"
              echo "Pipeline version code: $(COMPUTED_VERSION_CODE)"
              echo "Pipeline version name: $(androidVersionName)"
              unzip -p "$AAB_PATH" base/manifest/AndroidManifest.xml | grep -E 'versionCode|versionName' || true
            displayName: Verify built AAB version metadata
          - script: |
              echo "Build completed successfully"
              echo "Version: $(androidVersionName)"
              echo "Build Code: $(COMPUTED_VERSION_CODE)"
            displayName: Build Summary
          - task: PublishBuildArtifacts@1
            displayName: Publish APK/AAB Artifacts
            inputs:
              PathtoPublish: $(System.DefaultWorkingDirectory)/android/app/build/outputs
              ArtifactName: android-build-$(androidVersionName)
              publishLocation: Container
        ${{ if or(eq(parameters.agentPool, 'Sparklight-Mac'), and(eq(parameters.agentPool, 'auto'), eq(variables['Build.RequestedForEmail'], 'Mohit.Sharma@cableone.biz'))) }}:
          pool:
            name: Sparklight-Mac
            demands:
              - Agent.OS -equals Darwin
              - Agent.OSArchitecture -equals ARM64
        ${{ else }}:
          pool:
            name: Azure Pipelines
            vmImage: macos-latest
    variables:
      iosBuildNumber: $[stageDependencies.Setup.SetupJob.outputs['storeVersions.iosBuildNumber']]
  - stage: IOSBuild
    displayName: 05 · iOS Build
    dependsOn:
      - AndroidBuild
      - Setup
    condition: succeeded()
    jobs:
      - job: IOSBuildJob
        displayName: 05 · iOS Build
        timeoutInMinutes: 40
        steps:
          - checkout: self
            clean: true
          - ${{ if not(or(eq(parameters.agentPool, 'Sparklight-Mac'), and(eq(parameters.agentPool, 'auto'), eq(variables['Build.RequestedForEmail'], 'Mohit.Sharma@cableone.biz')))) }}:
              - task: UseRubyVersion@0
                inputs:
                  versionSpec: ">= 3.3"
                  addToPath: true
                displayName: Select hosted Ruby
              - script: |
                  set -euo pipefail
                  gem install --user-install --no-document cocoapods:1.15.2
                  GEM_BIN="$(ruby -r rubygems -e 'print Gem.user_dir')/bin"
                  echo "##vso[task.prependpath]$GEM_BIN"
                displayName: Prepare hosted Ruby build tools
          - task: NodeTool@0
            displayName: Install Node 20.x
            inputs:
              versionSpec: 20.x
          - template: pipelines/templates/cache-npm.yml
          - script: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
            displayName: Install Dependencies
          - script: |
              set -euo pipefail
              if [ ! -f node_modules/native-base/lib/commonjs/components/composites/AspectRatio/index.js ]; then
                echo "NativeBase install is incomplete; reinstalling the locked package."
                rm -rf node_modules/native-base
                npm install --no-save --legacy-peer-deps --prefer-offline --no-audit native-base@3.4.28
              fi
              test -f node_modules/native-base/lib/commonjs/components/composites/AspectRatio/index.js
            displayName: Verify NativeBase installation
          - script: |
              set -euo pipefail
              REQUIRED_XCODE_MAJOR="$(IOS_REQUIRED_XCODE_MAJOR)"
              export DEVELOPER_DIR="$(xcode-select -p)"
              if [ "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -lt "$REQUIRED_XCODE_MAJOR" ]; then
                for candidate in /Applications/Xcode*.app/Contents/Developer; do
                  if [ "$(DEVELOPER_DIR="$candidate" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null | cut -d. -f1)" -ge "$REQUIRED_XCODE_MAJOR" ] 2>/dev/null; then
                    export DEVELOPER_DIR="$candidate"
                    break
                  fi
                done
              fi
              echo "##vso[task.setvariable variable=DEVELOPER_DIR]$DEVELOPER_DIR"
              xcodebuild -version
              SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
              if [ "${SDK_VERSION%%.*}" -lt "$REQUIRED_XCODE_MAJOR" ]; then
                echo "Required iOS SDK $REQUIRED_XCODE_MAJOR or later; found $SDK_VERSION"
                exit 1
              fi
              ruby -v
              pod --version
            displayName: Select Xcode and verify build tools
          - script: |
              set -euo pipefail
              XCODE_CACHE_VERSION=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
              echo "##vso[task.setvariable variable=XCODE_CACHE_VERSION]$XCODE_CACHE_VERSION"
              # Branch refs contain slashes; hash them so Cache@2 cannot treat them as paths.
              XCODE_CACHE_BRANCH=$(printf '%s' "$BUILD_SOURCEBRANCH" | shasum -a 256 | cut -d ' ' -f 1)
              echo "##vso[task.setvariable variable=XCODE_CACHE_BRANCH]$XCODE_CACHE_BRANCH"
              # Freeze cache inputs before pod install and signing patches change them.
              XCODE_CACHE_INPUTS=$(shasum -a 256 ios/Podfile.lock "ios/My Sparklight.xcodeproj/project.pbxproj" | shasum -a 256 | cut -d ' ' -f 1)
              echo "##vso[task.setvariable variable=XCODE_CACHE_INPUTS]$XCODE_CACHE_INPUTS"
              mkdir -p "$(Pipeline.Workspace)/xcode-derived-data"
            displayName: Resolve Xcode cache version
          # Self-hosted Mac retains DerivedData locally; avoid uploading it after every commit.
          - ${{ if not(or(eq(parameters.agentPool, 'Sparklight-Mac'), and(eq(parameters.agentPool, 'auto'), eq(variables['Build.RequestedForEmail'], 'Mohit.Sharma@cableone.biz')))) }}:
              - task: Cache@2
                displayName: Cache Xcode build intermediates
                inputs:
                  key: xcode-v2 | "$(Agent.OS)" | "$(XCODE_CACHE_VERSION)" | "$(XCODE_CACHE_INPUTS)" | "$(XCODE_CACHE_BRANCH)" | "$(Build.SourceVersion)"
                  restoreKeys: |
                    xcode-v2 | "$(Agent.OS)" | "$(XCODE_CACHE_VERSION)" | "$(XCODE_CACHE_INPUTS)" | "$(XCODE_CACHE_BRANCH)"
                  path: $(Pipeline.Workspace)/xcode-derived-data
          - script: |
              set -euo pipefail
              PODS_DOWNLOADS_PATH="$HOME/Library/Caches/CocoaPods"
              mkdir -p "$PODS_DOWNLOADS_PATH"
              # Capture the checked-in lockfile hash before pod install can update metadata.
              PODS_DOWNLOADS_LOCK_HASH=$(shasum -a 256 ios/Podfile.lock | awk '{print $1}')
              echo "##vso[task.setvariable variable=PODS_DOWNLOADS_PATH]$PODS_DOWNLOADS_PATH"
              echo "##vso[task.setvariable variable=PODS_DOWNLOADS_LOCK_HASH]$PODS_DOWNLOADS_LOCK_HASH"
            displayName: Prepare CocoaPods downloads cache
          - task: Cache@2
            displayName: Cache CocoaPods downloads
            inputs:
              key: pods-downloads-v2 | "$(Agent.OS)" | "$(PODS_DOWNLOADS_LOCK_HASH)"
              restoreKeys: |
                pods-downloads-v2 | "$(Agent.OS)"
              path: $(PODS_DOWNLOADS_PATH)
          - script: |
              set -euo pipefail
              cd ios
              # Keep Podfile.lock version constraints; allow runner-specific CocoaPods/spec metadata.
              pod install --ansi
            displayName: Install CocoaPods dependencies
          - script: |
              set -euo pipefail
              PBXPROJ="ios/My Sparklight.xcodeproj/project.pbxproj"
              perl -pi -e 's/CODE_SIGN_IDENTITY = "iOS Distribution"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' "$PBXPROJ"
              perl -pi -e 's/"iOS Distribution"/"Apple Distribution"/g' "$PBXPROJ"
              perl -pi -e 's/CODE_SIGN_IDENTITY\[sdk=iphoneos\*\] = "iOS Distribution"/CODE_SIGN_IDENTITY[sdk=iphoneos*] = "Apple Distribution"/g' "$PBXPROJ"
              echo "✅ Patched CODE_SIGN_IDENTITY"
            displayName: Patch code sign identity
          - task: DownloadSecureFile@1
            name: iosP12
            displayName: Download Apple Certificate (.p12)
            inputs:
              secureFile: $(IOS_P12_CERT)
          - script: |
              set -euo pipefail
              P12_PASSWORD="${IOS_CERT_PASSWORD:-${IOS_P12_PASSWORD:-}}"
              KEYCHAIN_PATH="$(Agent.TempDirectory)/ios-signing.keychain-db"
              KEYCHAIN_PASSWORD="temp_keychain_$(date +%s)"
              security list-keychains -d user > "$(Agent.TempDirectory)/sparklight-keychains-before.txt"
              security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
              security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
              security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

              IMPORT_OUTPUT_FILE="$(Agent.TempDirectory)/import_output.txt"
              set +e
              security import "$(iosP12.secureFilePath)" \
                -k "$KEYCHAIN_PATH" \
                -P "$P12_PASSWORD" \
                -T /usr/bin/codesign \
                -T /usr/bin/security > "$IMPORT_OUTPUT_FILE" 2>&1
              IMPORT_EXIT_CODE=$?
              set -e

              if [ $IMPORT_EXIT_CODE -ne 0 ]; then
                echo "Initial certificate import failed:"
                cat "$IMPORT_OUTPUT_FILE"

                if [ -n "$P12_PASSWORD" ]; then
                  echo "Retrying certificate import with empty password..."
                  set +e
                  security import "$(iosP12.secureFilePath)" \
                    -k "$KEYCHAIN_PATH" \
                    -P "" \
                    -T /usr/bin/codesign \
                    -T /usr/bin/security > "$IMPORT_OUTPUT_FILE" 2>&1
                  IMPORT_EXIT_CODE=$?
                  set -e
                fi
              fi

              if [ $IMPORT_EXIT_CODE -ne 0 ]; then
                echo "Certificate import failed after retries:"
                cat "$IMPORT_OUTPUT_FILE"
                echo "Ensure IOS_CERT_PASSWORD or IOS_P12_PASSWORD matches the uploaded .p12 file."
                exit 1
              fi

              security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>&1 || true
              EXISTING=$(security list-keychains -d user | tr -d '"' | xargs)
              security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING

              echo "##vso[task.setvariable variable=IOS_KEYCHAIN_PATH]$KEYCHAIN_PATH"
              echo "##vso[task.setvariable variable=IOS_KEYCHAIN_PASSWORD;issecret=true]$KEYCHAIN_PASSWORD"
              echo "✅ Certificate imported"
            displayName: Install certificate into keychain
            env:
              IOS_CERT_PASSWORD: $(IOS_CERT_PASSWORD)
              IOS_P12_PASSWORD: $(IOS_P12_PASSWORD)
          - task: InstallAppleProvisioningProfile@1
            name: iosProvProfile
            displayName: Install provisioning profile
            inputs:
              provisioningProfileLocation: secureFiles
              provProfileSecureFile: $(IOS_PROV_PROFILE_SECUREFILE)
              removeProfile: true
          - script: |
              set -euo pipefail
              echo "Disabling code signing for all Pods xcconfig targets..."
              find "ios/Pods" -name "*.xcconfig" | while IFS= read -r f; do
                grep -q "CODE_SIGNING_ALLOWED" "$f" || echo "CODE_SIGNING_ALLOWED = NO" >> "$f"
              done
              echo "✅ Pods code signing disabled"
            displayName: Disable code signing for Pods
          - script: |
              set -euo pipefail
              APP_INFO_PLIST="ios/Sparklight/Info.plist"
              BUILD_NUMBER="$(iosBuildNumber)"
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP_INFO_PLIST" \
                || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$APP_INFO_PLIST"
              IOS_MARKETING_VERSION="$(iosVersionName)"
              if [ -n "$IOS_MARKETING_VERSION" ]; then
                /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $IOS_MARKETING_VERSION" "$APP_INFO_PLIST" \
                  || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $IOS_MARKETING_VERSION" "$APP_INFO_PLIST"
              fi
              echo "iOS build number: $BUILD_NUMBER"
              echo "iOS marketing version: ${IOS_MARKETING_VERSION:-<unchanged>}"
            displayName: Set iOS build number and marketing version
          - script: |
              set -euo pipefail
              TARGET_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH:-}"
              SOURCE_BRANCH="$(Build.SourceBranchName)"
              IOS_SCHEME="Sparklight UAT"

              if [ "$(Build.Reason)" = "PullRequest" ]; then
                case "$TARGET_BRANCH" in
                  refs/heads/Dev|Dev)
                    IOS_SCHEME="Sparklight UAT"
                    ;;
                  refs/heads/Demo|Demo)
                    IOS_SCHEME="Sparklight UAT"
                    ;;
                  refs/heads/Prod|Prod|refs/heads/prod|prod|refs/heads/main|main)
                    IOS_SCHEME="Sparklight Prod"
                    ;;
                esac
              else
                case "$SOURCE_BRANCH" in
                  Dev)
                    IOS_SCHEME="Sparklight UAT"
                    ;;
                  Demo)
                    IOS_SCHEME="Sparklight UAT"
                    ;;
                  Prod|prod|main)
                    IOS_SCHEME="Sparklight Prod"
                    ;;
                esac
              fi

              echo "Resolved iOS scheme: $IOS_SCHEME"
              echo "##vso[task.setvariable variable=IOS_SCHEME]$IOS_SCHEME"

              NODE_BIN="$(command -v node)"
              echo "export NODE_BINARY=$NODE_BIN" > ios/.xcode.env.local
              ARCHIVE_PATH="$(Build.ArtifactStagingDirectory)/Sparklight.xcarchive"
              EXPORT_PATH="$(Build.ArtifactStagingDirectory)/ipa"
              ARCHIVE_LOG="$(Build.ArtifactStagingDirectory)/xcodebuild-archive.log"
              JOBS="$(sysctl -n hw.ncpu || echo 2)"
              TEAM_ID="$(IOS_TEAM_ID)"
              BUNDLE_ID="$(IOS_BUNDLE_ID)"
              PROV_UUID="$(iosProvProfile.provisioningProfileUuid)"

              echo "Archiving with Xcode using $JOBS parallel jobs..."
              if ! RCT_NO_LAUNCH_PACKAGER=1 xcodebuild \
                  -workspace "ios/My Sparklight.xcworkspace" \
                  -scheme "$IOS_SCHEME" \
                  -configuration Release \
                  -sdk iphoneos \
                  -archivePath "$ARCHIVE_PATH" \
                  -destination "generic/platform=iOS" \
                  -parallelizeTargets \
                  -showBuildTimingSummary \
                  -jobs "$JOBS" \
                  -derivedDataPath "$(Pipeline.Workspace)/xcode-derived-data" \
                  PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
                  CURRENT_PROJECT_VERSION="$(iosBuildNumber)" \
                  CODE_SIGN_STYLE=Manual \
                  DEVELOPMENT_TEAM="$TEAM_ID" \
                  PROVISIONING_PROFILE="$PROV_UUID" \
                  CODE_SIGN_IDENTITY="$(IOS_CODE_SIGN_IDENTITY)" \
                  OTHER_CODE_SIGN_FLAGS="--keychain $(IOS_KEYCHAIN_PATH)" \
                  COMPILER_INDEX_STORE_ENABLE=NO \
                  archive 2>&1 | tee "$ARCHIVE_LOG"; then
                echo "❌ Xcode archive failed"
                grep -i "error:" "$ARCHIVE_LOG" | tail -20 || true
                exit 1
              fi

              EXPORT_OPTS="$(Build.ArtifactStagingDirectory)/exportOptions.plist"
              cat > "$EXPORT_OPTS" <<EOF
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                <key>method</key>
                <string>app-store</string>
                <key>signingStyle</key>
                <string>manual</string>
                <key>teamID</key>
                <string>${TEAM_ID}</string>
                <key>provisioningProfiles</key>
                <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROV_UUID}</string>
                </dict>
                <key>compileBitcode</key>
                <false/>
              </dict>
              </plist>
              EOF

              mkdir -p "$EXPORT_PATH"
              if ! xcodebuild \
                  -exportArchive \
                  -archivePath "$ARCHIVE_PATH" \
                  -exportPath "$EXPORT_PATH" \
                  -exportOptionsPlist "$EXPORT_OPTS" 2>&1 | tee "$(Build.ArtifactStagingDirectory)/xcodebuild-export.log"; then
                echo "❌ IPA export failed"
                tail -n 100 "$(Build.ArtifactStagingDirectory)/xcodebuild-export.log" || true
                exit 1
              fi

              echo "✅ IPA exported:"
              find "$EXPORT_PATH" -maxdepth 1 -name "*.ipa" -exec ls -lh {} \;
            displayName: Xcode archive and export IPA
          - task: PublishBuildArtifacts@1
            displayName: Publish IPA artifact
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/ipa
              ArtifactName: ios-ipa
              publishLocation: Container
          - script: |
              set -euo pipefail
              python3 - <<'PY'
              import pathlib, shlex, subprocess
              snapshot = pathlib.Path("$(Agent.TempDirectory)/sparklight-keychains-before.txt")
              keychain = pathlib.Path("$(Agent.TempDirectory)/ios-signing.keychain-db")
              if snapshot.exists():
                  paths = shlex.split(snapshot.read_text())
                  subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *paths], check=True)
                  snapshot.unlink()
              if keychain.exists():
                  subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
              PY
            displayName: Restore personal keychain search list
            condition: always()
        ${{ if or(eq(parameters.agentPool, 'Sparklight-Mac'), and(eq(parameters.agentPool, 'auto'), eq(variables['Build.RequestedForEmail'], 'Mohit.Sharma@cableone.biz'))) }}:
          pool:
            name: Sparklight-Mac
            demands:
              - Agent.OS -equals Darwin
              - Agent.OSArchitecture -equals ARM64
        ${{ else }}:
          pool:
            name: Azure Pipelines
            vmImage: macos-latest
    variables:
      iosBuildNumber: $[stageDependencies.Setup.SetupJob.outputs['storeVersions.iosBuildNumber']]
  - stage: ValidateArtifacts
    displayName: 06 · Validate Artifacts
    dependsOn:
      - IOSBuild
      - Setup
    condition: succeeded()
    jobs:
      - job: ValidateArtifactsJob
        displayName: 06 · Validate Artifacts
        timeoutInMinutes: 5
        steps:
          - checkout: self
            clean: true
          - task: DownloadPipelineArtifact@2
            displayName: Download ios-ipa
            inputs:
              buildType: current
              artifactName: ios-ipa
              targetPath: $(Pipeline.Workspace)/ios-ipa
          - task: DownloadPipelineArtifact@2
            displayName: Download android-build-$(androidVersionName)
            inputs:
              buildType: current
              artifactName: android-build-$(androidVersionName)
              targetPath: $(Pipeline.Workspace)/android-build
          - script: |
              echo "Build and test stages completed. Review published lint and security reports for advisory findings or skipped scans."
            displayName: Review Quality Gates
          - script: |
              echo "Generating Build Report..."
              echo "Build Version: $(androidVersionName)"
              echo "Build Number: $(androidVersionCode)"
              echo "Commit: $(Build.SourceVersion)"
              echo "Branch: $(Build.SourceBranchName)"
              echo "Timestamp: $(Build.StartTime)"
            displayName: Generate Build Report
          - script: |
              set -euo pipefail
              IPA_PATH=$(find "$(Pipeline.Workspace)/ios-ipa" -maxdepth 1 -type f -name "*.ipa" | head -n 1)
              if [ -z "$IPA_PATH" ]; then
                echo "❌ No IPA found in ios-ipa artifact"
                find "$(Pipeline.Workspace)/ios-ipa" -maxdepth 5 || true
                exit 1
              fi
              echo "✅ IPA validated for staging: $IPA_PATH"
              ls -lh "$IPA_PATH"
            displayName: Validate IPA artifact
          - script: |
              set -euo pipefail
              AAB_PATH=$(find "$(Pipeline.Workspace)/android-build" -type f -name "*.aab" | head -n 1)
              if [ -z "$AAB_PATH" ]; then
                echo "❌ No AAB found for Android staging"
                find "$(Pipeline.Workspace)/android-build" -maxdepth 5 || true
                exit 1
              fi
              echo "✅ AAB validated for Android staging: $AAB_PATH"
              ls -lh "$AAB_PATH"
            displayName: Validate Android AAB artifact
        ${{ if or(eq(parameters.agentPool, 'Sparklight-Mac'), and(eq(parameters.agentPool, 'auto'), eq(variables['Build.RequestedForEmail'], 'Mohit.Sharma@cableone.biz'))) }}:
          pool:
            name: Sparklight-Mac
            demands:
              - Agent.OS -equals Darwin
              - Agent.OSArchitecture -equals ARM64
        ${{ else }}:
          pool:
            name: Azure Pipelines
            vmImage: macos-latest
    variables:
      iosBuildNumber: $[stageDependencies.Setup.SetupJob.outputs['storeVersions.iosBuildNumber']]
  - stage: TestFlight
    displayName: 07 · TestFlight
    dependsOn:
      - ValidateArtifacts
      - Setup
    condition: succeeded()
    jobs:
      - job: TestFlightJob
        displayName: 07 · TestFlight
        timeoutInMinutes: 25
        steps:
          - checkout: self
            clean: true
          - task: DownloadPipelineArtifact@2
            displayName: Download commit release notes
            inputs:
              buildType: current
              artifactName: release-notes
              targetPath: $(Pipeline.Workspace)/release-notes
          - ${{ if not(or(eq(parameters.agentPool, 'Sparklight-Mac'), and(eq(parameters.agentPool, 'auto'), eq(variables['Build.RequestedForEmail'], 'Mohit.Sharma@cableone.biz')))) }}:
              - task: UseRubyVersion@0
                inputs:
                  versionSpec: ">= 3.3"
                  addToPath: true
                displayName: Select hosted Ruby
              - script: |
                  set -euo pipefail
                  gem install --user-install --no-document fastlane:2.240.1
                  GEM_BIN="$(ruby -r rubygems -e 'print Gem.user_dir')/bin"
                  echo "##vso[task.prependpath]$GEM_BIN"
                displayName: Prepare hosted Ruby build tools
          - task: DownloadPipelineArtifact@2
            displayName: Download ios-ipa
            inputs:
              buildType: current
              artifactName: ios-ipa
              targetPath: $(Pipeline.Workspace)/ios-ipa
          - task: DownloadSecureFile@1
            name: ascApiKey
            displayName: Download App Store Connect API key (.p8)
            inputs:
              secureFile: $(IOS_ASC_API_KEY_SECUREFILE)
            condition: and(succeeded(), and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['DEPLOY_TO_TESTFLIGHT'], 'true')))
          - script: |
              set -euo pipefail
              IPA_PATH=$(find "$(Pipeline.Workspace)/ios-ipa" -maxdepth 1 -type f -name "*.ipa" | head -n 1)
              if [ -z "$IPA_PATH" ]; then
                echo "❌ No IPA found in ios-ipa artifact"
                exit 1
              fi

              KEY_PATH="$(ascApiKey.secureFilePath)"
              RELEASE_NOTES_FILE="$(Pipeline.Workspace)/release-notes/testflight.txt"
              test -s "$RELEASE_NOTES_FILE"

              echo "Uploading $IPA_PATH to TestFlight..."
              if ! command -v fastlane >/dev/null 2>&1; then
                echo "Fastlane is missing. Install it in the agent Ruby environment before running this pipeline."
                exit 1
              fi
              API_KEY_JSON="$(Agent.TempDirectory)/app-store-connect-api-key.json"
              umask 077
              trap 'rm -f "$API_KEY_JSON"' EXIT
              jq -n \
                --arg key_id "$(IOS_ASC_API_KEY_ID)" \
                --arg issuer_id "$(IOS_ASC_API_ISSUER_ID)" \
                --arg key "$(cat "$KEY_PATH")" \
                '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' > "$API_KEY_JSON"
              # Apple must expose the uploaded build before Fastlane can attach these notes.
              export FASTLANE_SKIP_UPDATE_CHECK=1
              export FASTLANE_HIDE_CHANGELOG=1
              fastlane --version
              UPLOAD_STARTED=$SECONDS
              fastlane pilot upload \
                --ipa "$IPA_PATH" \
                --api_key_path "$API_KEY_JSON" \
                --changelog "$(cat "$RELEASE_NOTES_FILE")" \
                --skip_waiting_for_build_processing true
              echo "✅ IPA uploaded and TestFlight notes attached in $((SECONDS - UPLOAD_STARTED)) seconds. Apple processing continues separately."
            displayName: Upload IPA to TestFlight
            timeoutInMinutes: 20
            condition: and(succeeded(), and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['DEPLOY_TO_TESTFLIGHT'], 'true')))
          - task: PublishBuildArtifacts@1
            displayName: Publish TestFlight release notes
            condition: and(succeededOrFailed(), and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['DEPLOY_TO_TESTFLIGHT'], 'true')))
            inputs:
              PathtoPublish: $(Pipeline.Workspace)/release-notes/testflight.txt
              ArtifactName: testflight-release-notes
              publishLocation: Container
          - script: |
              python3 - <<'PYEOF'
              import smtplib, os
              from email.mime.text import MIMEText
              from email.mime.multipart import MIMEMultipart

              smtp_server   = os.environ.get('SMTP_SERVER', '').strip()
              smtp_port     = int(os.environ.get('SMTP_PORT', '587') or '587')
              smtp_user     = os.environ.get('SMTP_USERNAME', '').strip()
              smtp_pass     = os.environ.get('SMTP_PASSWORD', '').strip()
              raw_recipients = os.environ.get('NOTIFICATION_EMAILS', '').strip()
              recipients    = [r.strip() for r in raw_recipients.split(',') if r.strip()]
              ios_version   = os.environ.get('IOS_VERSION_NAME', 'N/A')
              build_num     = os.environ.get('IOS_BUILD_NUMBER', 'N/A')
              branch        = os.environ.get('BUILD_BRANCH', 'N/A')
              commit        = os.environ.get('BUILD_COMMIT', 'N/A')
              bundle_id     = os.environ.get('IOS_BUNDLE_ID', 'N/A')
              pipeline_url  = os.environ.get('BUILD_URL', '')

              if not smtp_server or not smtp_user or not smtp_pass or not recipients:
                  print('Email notification skipped: SMTP credentials or NOTIFICATION_EMAILS not configured.')
                  exit(0)

              msg = MIMEMultipart('alternative')
              msg['From']    = smtp_user
              msg['To']      = ', '.join(recipients)
              msg['Subject'] = f'[MySparklight] iOS v{ios_version} Uploaded to TestFlight'

              body_text = f"""MySparklight Residential - iOS Deployment Notification

              The iOS app has been successfully uploaded to TestFlight.

              Version    : {ios_version}
              Build No   : {build_num}
              Bundle ID  : {bundle_id}
              Branch     : {branch}
              Commit     : {commit}
              Destination: TestFlight (App Store Connect)
              Pipeline   : {pipeline_url}

              This is an automated notification from the Azure DevOps CI/CD pipeline.
              """

              body_html = f"""<html><body>
              <h2 style='color:#1565c0;'>&#x2705; iOS Uploaded to TestFlight</h2>
              <table style='border-collapse:collapse;font-family:Arial,sans-serif;font-size:14px;'>
                <tr><td style='padding:4px 12px;font-weight:bold;'>App</td><td style='padding:4px 12px;'>MySparklight Residential (iOS)</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Version</td><td style='padding:4px 12px;'>{ios_version}</td></tr>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Build No</td><td style='padding:4px 12px;'>{build_num}</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Bundle ID</td><td style='padding:4px 12px;'>{bundle_id}</td></tr>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Branch</td><td style='padding:4px 12px;'>{branch}</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Commit</td><td style='padding:4px 12px;'>{commit}</td></tr>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Destination</td><td style='padding:4px 12px;'>TestFlight (App Store Connect)</td></tr>
              </table>
              <br/><p style='color:#555;font-size:12px;'>This is an automated notification from the Azure DevOps CI/CD pipeline.</p>
              </body></html>"""

              msg.attach(MIMEText(body_text, 'plain'))
              msg.attach(MIMEText(body_html, 'html'))

              try:
                  with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as server:
                      server.ehlo()
                      server.starttls()
                      server.ehlo()
                      server.login(smtp_user, smtp_pass)
                      server.sendmail(smtp_user, recipients, msg.as_string())
                  print(f'Email notification sent to: {recipients}')
              except Exception as e:
                  print(f'Email notification failed: {e}')
                  exit(1)
              PYEOF
            displayName: Send iOS TestFlight Email Notification
            continueOnError: true
            env:
              SMTP_SERVER: $(SMTP_SERVER)
              SMTP_PORT: $(SMTP_PORT)
              SMTP_USERNAME: $(SMTP_USERNAME)
              SMTP_PASSWORD: $(SMTP_PASSWORD)
              NOTIFICATION_EMAILS: $(NOTIFICATION_EMAILS)
              IOS_VERSION_NAME: $(androidVersionName)
              IOS_BUILD_NUMBER: $(iosBuildNumber)
              IOS_BUNDLE_ID: $(IOS_BUNDLE_ID)
              BUILD_BRANCH: $(Build.SourceBranchName)
              BUILD_COMMIT: $(Build.SourceVersion)
              BUILD_URL: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['DEPLOY_TO_TESTFLIGHT'], 'true'))
        ${{ if or(eq(parameters.agentPool, 'Sparklight-Mac'), and(eq(parameters.agentPool, 'auto'), eq(variables['Build.RequestedForEmail'], 'Mohit.Sharma@cableone.biz'))) }}:
          pool:
            name: Sparklight-Mac
            demands:
              - Agent.OS -equals Darwin
              - Agent.OSArchitecture -equals ARM64
        ${{ else }}:
          pool:
            name: Azure Pipelines
            vmImage: macos-latest
    variables:
      iosBuildNumber: $[stageDependencies.Setup.SetupJob.outputs['storeVersions.iosBuildNumber']]
  - stage: PlayStore
    displayName: 08 · Play Store Internal
    dependsOn:
      - TestFlight
      - Setup
    condition: succeeded()
    jobs:
      - job: PlayStoreJob
        displayName: 08 · Play Store Internal
        timeoutInMinutes: 15
        steps:
          - checkout: self
            clean: true
          - task: DownloadPipelineArtifact@2
            displayName: Download commit release notes
            inputs:
              buildType: current
              artifactName: release-notes
              targetPath: $(Pipeline.Workspace)/release-notes
          - task: DownloadPipelineArtifact@2
            displayName: Download android-build-$(androidVersionName)
            inputs:
              buildType: current
              artifactName: android-build-$(androidVersionName)
              targetPath: $(Pipeline.Workspace)/android-build
          - script: |
              AAB_PATH=$(find "$(Pipeline.Workspace)/android-build" -type f -name "*.aab" | head -n 1)
              if [ -z "$AAB_PATH" ]; then
                echo "❌ No AAB file found under $(Pipeline.Workspace)/android-build"
                find "$(Pipeline.Workspace)/android-build" -maxdepth 5 -type f | head -n 100
                exit 1
              fi
              echo "Using AAB: $AAB_PATH"
              echo "##vso[task.setvariable variable=AAB_FILE_PATH]$AAB_PATH"
            displayName: Resolve AAB for Internal Testing
            condition: and(succeeded(), and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['DEPLOY_TO_INTERNAL_TESTING'], 'true')))
          - script: |
              set -euo pipefail
              RELEASE_NOTES_FILE="$(Pipeline.Workspace)/release-notes/android.txt"
              test -s "$RELEASE_NOTES_FILE"
              echo "##vso[task.setvariable variable=GOOGLE_PLAY_RELEASE_NOTES]$RELEASE_NOTES_FILE"
            displayName: Generate Play Store release notes
            condition: and(succeeded(), and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['DEPLOY_TO_INTERNAL_TESTING'], 'true')))
          - task: ms-vsclient.google-play.google-play-release.GooglePlayRelease@4
            displayName: Publish AAB to Play Store Internal Testing
            inputs:
              serviceConnection: PlaystoreRessiConnection
              applicationId: com.sparklight
              action: SingleBundle
              bundleFile: $(AAB_FILE_PATH)
              track: internal
              releaseName: MySparklight Residential $(androidVersionName)
              changeLogFile: $(GOOGLE_PLAY_RELEASE_NOTES)
            condition: and(succeeded(), and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['DEPLOY_TO_INTERNAL_TESTING'], 'true')))
          - script: |
              echo "✅ Internal testing deployment completed successfully"
              echo "Release: $(androidVersionName) ($(androidVersionCode))"
              echo "Status: Uploaded to Google Play Internal Testing"
            displayName: Internal Testing Deployment Complete
            condition: and(succeeded(), and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['DEPLOY_TO_INTERNAL_TESTING'], 'true')))
          - script: |
              python3 - <<'PYEOF'
              import smtplib, os
              from email.mime.text import MIMEText
              from email.mime.multipart import MIMEMultipart

              smtp_server   = os.environ.get('SMTP_SERVER', '').strip()
              smtp_port     = int(os.environ.get('SMTP_PORT', '587') or '587')
              smtp_user     = os.environ.get('SMTP_USERNAME', '').strip()
              smtp_pass     = os.environ.get('SMTP_PASSWORD', '').strip()
              raw_recipients = os.environ.get('NOTIFICATION_EMAILS', '').strip()
              recipients    = [r.strip() for r in raw_recipients.split(',') if r.strip()]
              version       = os.environ.get('ANDROID_VERSION_NAME', 'N/A')
              build_num     = os.environ.get('ANDROID_VERSION_CODE', 'N/A')
              branch        = os.environ.get('BUILD_BRANCH', 'N/A')
              commit        = os.environ.get('BUILD_COMMIT', 'N/A')
              pipeline_url  = os.environ.get('BUILD_URL', '')

              if not smtp_server or not smtp_user or not smtp_pass or not recipients:
                  print('Email notification skipped: SMTP credentials or NOTIFICATION_EMAILS not configured.')
                  exit(0)

              msg = MIMEMultipart('alternative')
              msg['From']    = smtp_user
              msg['To']      = ', '.join(recipients)
              msg['Subject'] = f'[MySparklight] Android v{version} Deployed to Play Store Internal Testing'

              body_text = f"""MySparklight Residential - Android Deployment Notification

              The Android app has been successfully deployed to Google Play Store Internal Testing.

              Version  : {version}
              Build No : {build_num}
              Branch   : {branch}
              Commit   : {commit}
              Track    : Internal Testing
              Pipeline : {pipeline_url}

              This is an automated notification from the Azure DevOps CI/CD pipeline.
              """

              body_html = f"""<html><body>
              <h2 style='color:#2e7d32;'>&#x2705; Android Deployed to Play Store Internal Testing</h2>
              <table style='border-collapse:collapse;font-family:Arial,sans-serif;font-size:14px;'>
                <tr><td style='padding:4px 12px;font-weight:bold;'>App</td><td style='padding:4px 12px;'>MySparklight Residential (Android)</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Version</td><td style='padding:4px 12px;'>{version}</td></tr>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Build No</td><td style='padding:4px 12px;'>{build_num}</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Branch</td><td style='padding:4px 12px;'>{branch}</td></tr>
                <tr><td style='padding:4px 12px;font-weight:bold;'>Commit</td><td style='padding:4px 12px;'>{commit}</td></tr>
                <tr style='background:#f5f5f5;'><td style='padding:4px 12px;font-weight:bold;'>Track</td><td style='padding:4px 12px;'>Internal Testing</td></tr>
              </table>
              <br/><p style='color:#555;font-size:12px;'>This is an automated notification from the Azure DevOps CI/CD pipeline.</p>
              </body></html>"""

              msg.attach(MIMEText(body_text, 'plain'))
              msg.attach(MIMEText(body_html, 'html'))

              try:
                  with smtplib.SMTP(smtp_server, smtp_port, timeout=30) as server:
                      server.ehlo()
                      server.starttls()
                      server.ehlo()
                      server.login(smtp_user, smtp_pass)
                      server.sendmail(smtp_user, recipients, msg.as_string())
