# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - Dev-B

pool:
  vmImage: ubuntu-latest

variables:
  group: AndroidBuildConfig
  buildConfiguration: 'Release'
  keystoreFile: 'Sparklight.keystore'
  keystoreAlias: 'sparklight'
  keystorePassword: $(jarsignerKeystorePassword)  
  keyPassword: $(jarsignerKeyPassword)            

steps:
- task: DownloadSecureFile@1
  inputs:
    secureFile: 'Sparklight.keystore'

- task: Gradle@3
  inputs:
    gradleWrapperFile: 'gradlew'
    workingDirectory: 'android'
    options: '-Pandroid.injected.signing.store.file=$(keystoreFile) -Pandroid.injected.signing.store.password=$(keystorePassword) -Pandroid.injected.signing.key.alias=$(keystoreAlias) -Pandroid.injected.signing.key.password=$(keyPassword)'
    tasks: 'assembleRelease'
    publishJUnitResults: true
    testResultsFiles: '**/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    sonarQubeRunAnalysis: false
    spotBugsAnalysis: false

- task: AndroidSigning@2
  inputs:
    apkFiles: '**/*.apk'
    jarsign: true
    jarsignerKeystoreFile: 'Sparklight.keystore'
    jarsignerKeystorePassword: '$(jarsignerKeystorePassword)'
    jarsignerKeystoreAlias: 'sparklight'
    jarsignerKeyPassword: '$(jarsignerKeyPassword)'
    zipalign: true
- task: CopyFiles@2
  inputs:
    Contents: '**/*.apk'
    TargetFolder: '$(build.artifactstagingdirectory)'
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SparklightResiApp'
    publishLocation: 'Container'
- task: publishPlaystore@1
  inputs:
    jsonFile: 'mysparklight-8b7c176d4906.json'
    apkPath: 'Build.ArtifactStagingDirectory'
    packageName: 'com.sparklight'
    locale: 'en-US'
    message: 'This is the first build from piepline'
    track: 'alpha'