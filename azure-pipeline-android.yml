# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - Dev-B

pool:
  vmImage: ubuntu-latest

variables:
  group: AndroidBuildConfig
  buildConfiguration: 'Release'
  keystoreFile: 'Sparklight.keystore'
  keystoreAlias: 'sparklight'
  keystorePassword: $(jarsignerKeystorePassword)  
  keyPassword: $(jarsignerKeyPassword)            

steps:
- task: DownloadSecureFile@1
  inputs:
    secureFile: 'Sparklight.keystore'
- task: NodeTool@0
  displayName: 'Install Node'
  inputs:
    versionSpec: '20.6.1'

- script: npm cache clean --force 
  workingDirectory: src
  displayName: 'Cleaning npm modules'

- script: npm install --legacy-peer-deps
  workingDirectory: src
  displayName: 'Install node dependencies'
  
- script: ./gradlew clean build --refresh-dependencies
  workingDirectory: 'android'
  displayName: 'Clean and Refresh Gradle Dependencies'
- task: Gradle@3
  inputs:
    gradleWrapperFile: 'android/gradlew'
    workingDirectory: 'android'
    options: '-Pandroid.injected.signing.store.file=$(keystoreFile) -Pandroid.injected.signing.store.password=$(keystorePassword) -Pandroid.injected.signing.key.alias=$(keystoreAlias) -Pandroid.injected.signing.key.password=$(keyPassword)'
    tasks: 'assembleRelease'
    publishJUnitResults: true
    testResultsFiles: '**/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.11'
    gradleOptions: '-Xmx3072m'
    sonarQubeRunAnalysis: false
    spotBugsAnalysis: false

- task: CopyFiles@2
  inputs:
    Contents: '**/*.apk'
    TargetFolder: '$(build.artifactstagingdirectory)'
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SparklightResiApp'
    publishLocation: 'Container'
- task: publishPlaystore@1
  inputs:
    jsonFile: 'mysparklight-8b7c176d4906.json'
    apkPath: 'Build.ArtifactStagingDirectory'
    packageName: 'com.sparklight'
    locale: 'en-US'
    message: 'This is the first build from piepline'
    track: 'alpha'