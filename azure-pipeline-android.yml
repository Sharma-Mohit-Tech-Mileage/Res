# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - Dev-B

pool:
  vmImage: ubuntu-latest

variables:
  group: AndroidBuildConfig
  buildConfiguration: 'Release'
  keystoreFile: 'android/Sparklight.keystore'
  keystoreAlias: 'sparklight'
  keystorePassword: $(jarsignerKeystorePassword)  
  keyPassword: $(jarsignerKeyPassword)            

steps:
- task: DownloadSecureFile@1
  inputs:
    secureFile: 'Sparklight.keystore'
- task: NodeTool@0
  displayName: 'Install Node'
  inputs:
    versionSpec: '20.6.1'

- script: npm cache clean --force 
  workingDirectory: src
  displayName: 'Cleaning npm modules'

- script: npm install --legacy-peer-deps
  workingDirectory: src
  displayName: 'Install node dependencies'
  
- task: Gradle@3
  inputs:
    
    workingDirectory: 'android'
    jdkArchitectureOption: 'x64'
    gradleWrapperFile: 'android/gradlew'
    publishJUnitResults: false
    testResultsFiles: '**/TEST-*.xml'
    gradleOptions: '-Xmx3072m'
    sonarQubeRunAnalysis: false
    spotBugsAnalysis: false
    tasks: 'assembleRelease'
- task: AndroidSigning@3
  inputs:
    apkFiles: '**/*.apk'
    apksignerKeystoreFile: 'Sparklight.keystore'
    apksignerKeystorePassword: 'sparklight_123'
    apksignerKeystoreAlias: 'sparklight'
    apksignerKeyPassword: 'sparklight_123'
- task: CopyFiles@2
  inputs:
    Contents: '**/*.apk'
    TargetFolder: '$(build.artifactstagingdirectory)'
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'SparklightResiApp'
    publishLocation: 'Container'
- task: publishPlaystore@1
  inputs:
    jsonFile: 'mysparklight-8b7c176d4906.json'
    apkPath: 'Build.ArtifactStagingDirectory'
    packageName: 'com.sparklight'
    locale: 'en-US'
    message: 'This is the first build from piepline'
    track: 'alpha'