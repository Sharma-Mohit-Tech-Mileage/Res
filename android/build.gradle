// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = '35.0.0'
        minSdkVersion = 24  // ⚠️ CHANGED from 23
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "28.2.13676358"  // ⚠️ CHANGED from 26.1.10909125
        kotlinVersion = "2.0.21"  // ⚠️ CHANGED from 1.9.24
        agpVersion = "8.5.1"  // ⚠️ NEW LINE ADDED

    }
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri( "https://zendesk.jfrog.io/artifactory/repo")
        }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:$agpVersion")  // ⚠️ Added :$agpVersion
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.3'
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")  // ⚠️ Added :$kotlinVersion
    }
}

apply plugin: "com.facebook.react.rootproject"