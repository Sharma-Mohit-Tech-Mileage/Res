apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
react {
    
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.sparklight"
    defaultConfig {
        applicationId "com.sparklight"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        manifestPlaceholders = [
            appAuthRedirectScheme: 'com.sparklight.customer.app.auth0://sparklight-customer.us.auth0.com/android/com.sparklight.customer.app/callback',
            appAuthRedirectScheme: 'com.sparklight.customer.app.auth0'
        ]
        missingDimensionStrategy 'react-native-camera', 'general'
        versionCode 116
        versionName "2.0.7"
        ndk {
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64", "armeabi"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'x86', 'arm64-v8a', 'x86_64', 'armeabi'
            universalApk false
        }
    }
}

afterEvaluate {
    tasks.matching {
        it.name.startsWith("package")
    }.all {
        it.doFirst {
            def ndkAbiFilters = ['armeabi-v7a', 'x86', 'arm64-v8a', 'x86_64']
            def allAbiFilters = ndkAbiFilters + ['armeabi']
            it.ndk.abiFilters = allAbiFilters
        }
    }
}

repositories {
    google()
    maven {
        url "https://zendesk.jfrog.io/artifactory/repo"
    }
    jcenter()
    mavenCentral()
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation platform('com.google.firebase:firebase-bom:32.5.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }

    implementation 'com.google.android:flexbox:2.0.1'

    api group: 'com.zendesk', name: 'chat', version: '2.2.0'
    api group: 'com.zendesk', name: 'messaging', version: '4.3.1'

    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
