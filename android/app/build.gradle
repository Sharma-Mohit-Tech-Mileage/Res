apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
// Apply the Google Services plugin
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'org.jetbrains.kotlin.android'

/**
 * Configuration block to customize the React Native Android app.
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    // Ensure these variables are defined correctly in rootProject or replace with explicit values
    ndkVersion "25.2.9519653"
    buildToolsVersion "33.0.2"
    compileSdkVersion 35

    namespace "com.sparklight"

    defaultConfig {
        applicationId "com.sparklight"
        minSdkVersion 21
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 35
        versionCode 187
        versionName "7.1.0"
        manifestPlaceholders = [
                appAuthRedirectScheme: 'com.sparklight.customer.app.auth0://sparklight-customer.us.auth0.com/android/com.sparklight.customer.app/callback'
        ]
        missingDimensionStrategy 'react-native-camera', 'general'
    }

    buildFeatures {
        prefab true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
    maven {
        url "https://zendesk.jfrog.io/artifactory/repo"
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:33.6.0')
    // Add the dependencies for the Firebase products you want to use
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    api group: 'com.zendesk', name: 'chat', version: '3.4.0'
    api group: 'com.zendesk', name: 'messaging', version: '5.4.0'
    implementation 'androidx.core:core-ktx:1.15.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
